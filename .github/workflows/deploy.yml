name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm ci

      - name: Build CSS
        run: npx tailwindcss -i themes/projects-theme/assets/css/main.css -o static/main.css --minify

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install og-image deps
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev
          pip install cairosvg requests pyyaml

      - name: Generate og-images
        run: python scripts/gen_og_image.py

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
