name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm ci

      - name: Build CSS
        run: npx tailwindcss -i themes/projects-theme/assets/css/main.css -o static/main.css --minify

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install og-image deps
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev
          pip install cairosvg requests pyyaml

      - name: Generate og-images
        run: python scripts/gen_og_image.py

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
