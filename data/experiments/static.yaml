- id: hello-ebpf
  tag: experimental
  group: "eBPF"
  tagline: "The first eBPF library for Java. Write eBPF programs and user-land code in pure Java."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You want to write eBPF tools without leaving the JVM
    - You are exploring Linux kernel observability from Java
    - You need custom schedulers, network filters, or tracing programs in Java
  when_not_to_use:
    - You need a production-ready, stable eBPF framework
    - You need broad Linux kernel version support (requires a recent kernel)
  vs: ~
  related: []
  links:
    - { label: "Blog series ↗", url: "https://mostlynerdless.de/blog/category/ebpf/" }
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <dependency>
          <groupId>me.bechberger</groupId>
          <artifactId>hello-ebpf</artifactId>
          <version>VERSION</version>
        </dependency>
  usage:
    - label: Simple tracepoint
      lang: java
      code: |
        // See the blog series for full examples
        BPFProgram prog = BPFProgram.load(MyProgram.class);
        prog.autoAttachPrograms();
        prog.tracePrintLoop(System.out::println);
  note: ""

