- id: hello-ebpf
  tag: experimental
  group: "eBPF"
  tagline: "The first eBPF library for Java. Write eBPF programs and the accompanying user-land code in pure Java 21+, without leaving the JVM. Covers tracepoints, kprobes, uprobes, network filters, and custom Linux schedulers via sched-ext. Use it when you want to write eBPF observability or scheduling tools in Java without a C toolchain."
  tagline_short: "Write eBPF programs in pure Java 21+ — tracepoints, kprobes, schedulers."
  screenshot: ""
  static_version: "0.1.4"
  github_pages: "https://parttimenerd.github.io/hello-ebpf/"
  when_to_use:
    - You want to write eBPF observability tools, schedulers, or network filters without leaving the JVM
    - You are exploring Linux kernel internals from Java
    - You want to follow the accompanying blog series and build understanding step by step
  when_not_to_use:
    - You need a production-ready, stable eBPF framework
    - You need broad kernel version support (requires a recent kernel with BTF)
    - You are on macOS or Windows
  vs: ~
  related: []
  links:
    - { label: "Blog series ↗", url: "https://mostlynerdless.de/blog/category/ebpf/" }
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <dependency>
          <groupId>me.bechberger</groupId>
          <artifactId>hello-ebpf</artifactId>
          <version>VERSION</version>
        </dependency>
  usage:
    - label: Simple tracepoint
      lang: java
      code: |
        // See the blog series for full examples
        BPFProgram prog = BPFProgram.load(MyProgram.class);
        prog.autoAttachPrograms();
        prog.tracePrintLoop(System.out::println);
  note: ""

- id: concurrency-fuzz-scheduler
  tag: experimental
  group: "eBPF"
  tagline: "Custom Linux sched-ext scheduler written in Java with hello-ebpf that deliberately perturbs thread scheduling to expose race conditions and lock ordering bugs in concurrent Java code. Use it when you want to stress-test concurrent code by forcing unusual thread interleavings on Linux."
  tagline_short: "eBPF scheduler that perturbs thread scheduling to surface race conditions."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You want to stress-test concurrent Java code by controlling thread interleaving
    - You are fuzzing for race conditions or lock ordering bugs that only surface under unusual scheduling
  when_not_to_use:
    - You need a stable, production-ready fuzzing framework
    - You are not on Linux with a recent kernel supporting sched-ext
  vs: ~
  related:
    - { label: "hello-ebpf", url: "https://github.com/parttimenerd/hello-ebpf" }
    - { label: "taskcontrol", url: "https://github.com/parttimenerd/taskcontrol" }
  links: []
  no_release: true
  install: ~
  usage: ~
  note: ""

- id: taskcontrol
  tag: experimental
  group: "eBPF"
  tagline: "Java API that sits on top of hello-ebpf and exposes fine-grained control over Linux thread scheduling, letting tests pause, resume, and reorder threads to reproduce hard-to-trigger concurrency bugs. Use it when you want deterministic control over thread interleaving in tests without writing C."
  tagline_short: "Fine-grained Java API to pause, resume, and reorder threads in tests."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You want deterministic control over thread interleaving in tests
    - You are building concurrency testing or fuzzing tooling on Linux
  when_not_to_use:
    - You need portable cross-platform scheduling control
  vs: ~
  related:
    - { label: "hello-ebpf", url: "https://github.com/parttimenerd/hello-ebpf" }
    - { label: "concurrency-fuzz-scheduler", url: "https://github.com/parttimenerd/concurrency-fuzz-scheduler" }
  links: []
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <dependency>
          <groupId>me.bechberger</groupId>
          <artifactId>taskcontrol</artifactId>
          <version>VERSION</version>
        </dependency>
  usage: ~
  note: ""

- id: sound-of-scheduling
  tag: demo
  group: "eBPF"
  tagline: "A Linux scheduler written in Java using hello-ebpf that translates scheduling decisions into MIDI notes in real time — each CPU core gets a voice, and context switches become music. A live demo of what eBPF and sched-ext make possible from pure Java."
  tagline_short: "Linux scheduler written in Java that turns context switches into MIDI music."
  screenshot: ""
  static_version: ""
  features:
    - Each CPU core maps to a distinct MIDI instrument voice
    - Context switches and wakeups trigger notes in real time
    - Built on hello-ebpf's sched-ext Java API
    - Great for live demos of eBPF and Java scheduling
  when_to_use: ~
  when_not_to_use: ~
  vs: ~
  related:
    - { label: "hello-ebpf", url: "https://github.com/parttimenerd/hello-ebpf" }
  links:
    - { label: "Blog post ↗", url: "https://mostlynerdless.de/blog/2024/01/02/writing-a-linux-scheduler-in-java-with-ebpf/" }
  no_release: true
  install: ~
  usage: ~
  note: "Pure fun. Don't use in production."

- id: check-language-version
  tag: experimental
  group: "Misc"
  tagline: "Static analyser that scans your Java source tree and reports the minimum language level each file actually requires, so you know exactly what is preventing you from lowering --release. Use it when you are planning a Java version migration and need a per-file breakdown before making changes."
  tagline_short: "Reports the minimum Java language level each source file actually requires."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You want to lower your project's --release target and need to know what's blocking it
    - You are auditing a multi-module project for language-level inconsistencies
    - You want a quick per-file breakdown before a Java version migration
  when_not_to_use:
    - You need a full static analysis tool with broader scope
  vs: ~
  related: []
  links: []
  no_release: false
  install:
    - label: Download
      lang: bash
      code: |
        gh release download --repo parttimenerd/check-language-version \
          --pattern '*.jar' -D .
  note: ""

