- id: hello-ebpf
  group: eBPF
  tag: experimental
  github_pages: https://parttimenerd.github.io/hello-ebpf/
  tagline: The Java library for eBPF. Write eBPF programs and the accompanying user-land code in pure
    Java 22+, without leaving the JVM. Covers tracepoints, kprobes, uprobes, XDP/TC network filters, and
    custom Linux schedulers via sched-ext.
  tagline_short: Write eBPF programs in pure Java 22+ — tracepoints, kprobes, schedulers, network filters.
  when_to_use:
  - You want to write eBPF observability tools, schedulers, or network filters without leaving the JVM
  - You are exploring Linux kernel internals from Java
  - You want to follow the accompanying blog series and build understanding step by step
  when_not_to_use:
  - You need a production-ready, stable eBPF framework
  - You need broad kernel version support (requires kernel 6.17+ with BTF)
  - You are on macOS or Windows (macOS works via Lima VM — see docs)
  links:
  - label: Blog series ↗
    url: https://mostlynerdless.de/blog/category/ebpf/
  no_release: true
  install:
  - label: Maven
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>bpf</artifactId>
        <version>VERSION</version>
      </dependency>
      <!-- also copy .mvn/jvm.config from the hello-ebpf repo and add the annotation processor: -->
      <plugin>
        <groupId>org.apache.maven.plugins</groupId>
        <artifactId>maven-compiler-plugin</artifactId>
        <version>3.8.0</version>
        <configuration>
          <annotationProcessors>
            <annotationProcessor>me.bechberger.ebpf.bpf.processor.Processor</annotationProcessor>
          </annotationProcessors>
          <compilerArgs>
            <arg>-Xplugin:BPFCompilerPlugin</arg>
          </compilerArgs>
        </configuration>
      </plugin>
  usage:
  - label: Tracepoint
    lang: java
    code: |
      @BPF(license = "GPL")
      public abstract class HelloWorld extends BPFProgram implements SystemCallHooks {
          @Override
          public void enterOpenat2(int dfd, String filename, Ptr<open_how> how) {
              bpf_trace_printk("opening: %s", filename);
          }
          public static void main(String[] args) {
              try (HelloWorld p = BPFProgram.load(HelloWorld.class)) {
                  p.autoAttachPrograms();
                  p.tracePrintLoop(f -> f.task() + ": " + f.msg());
              }
          }
      }
  how_to:
  - title: Set up prerequisites on Linux
    body: |
      Requires Linux kernel 6.17+, Java 22+, libbpf, and root privileges.
      ```bash
      apt install libbpf-dev linux-tools-common linux-tools-$(uname -r)
      ```
      Run the doctor script from the repo root to verify your setup:
      ```bash
      ./scripts/doctor.sh
      ```
  - title: Run a hello-world tracepoint program
    body: |
      The kernel-side method is compiled to BPF bytecode via the annotation processor at build time.
      Run with `sudo` and `--enable-native-access` (required for the Panama foreign-function API):
      ```bash
      mvn package
      sudo java --enable-native-access=ALL-UNNAMED \
           -cp target/bpf-samples.jar me.bechberger.ebpf.samples.HelloWorld
      ```
      Expected output (one line per `openat2` syscall from any process):
      ```
      cat: opening: /etc/hosts
      java: opening: /proc/self/status
      ```
  - title: Drop every third incoming packet with XDP
    body: |
      XDP hooks run directly in the kernel on every incoming packet — before the network stack:
      ```java
      @BPF(license = "GPL")
      public abstract class XDPDropEveryThirdPacket extends BPFProgram implements XDPHook {
          final GlobalVariable<@Unsigned Integer> count = new GlobalVariable<>(0);

          @Override
          public xdp_action xdpHandlePacket(Ptr<xdp_md> ctx) {
              count.set(count.get() + 1);
              return count.get() % 3 == 1 ? xdp_action.XDP_DROP : xdp_action.XDP_PASS;
          }

          public static void main(String[] args) throws InterruptedException {
              try (var p = BPFProgram.load(XDPDropEveryThirdPacket.class)) {
                  p.xdpAttach(XDPUtil.getNetworkInterfaceIndex());
                  while (true) { System.out.println("Packets: " + p.count.get()); Thread.sleep(1000); }
              }
          }
      }
      ```
  - title: Write a custom Linux CPU scheduler
    body: |
      sched_ext (kernel 6.14+) lets you replace the Linux CPU scheduler with BPF. The minimal
      scheduler needs just `enqueue()` — `SchedulerBase` provides the shared dispatch queue,
      `init()`, `dispatch()`, and `exit()` defaults:
      ```java
      @BPF(license = "GPL")
      @Property(name = "sched_name", value = "my_scheduler")
      public abstract class MyScheduler extends SchedulerBase implements Scheduler {
          final DispatchQueue shared = DispatchQueue.attach(SHARED_DSQ_ID);

          @Override
          public void enqueue(Ptr<task_struct> p, long enq_flags) {
              shared.insertScaled(p, EnqFlags.passThrough(enq_flags));
          }

          public static void main(String[] args) throws Exception {
              try (var sched = BPFProgram.load(MyScheduler.class)) {
                  sched.runSchedulerLoop(); // attach + block until Ctrl-C
              }
          }
      }
      ```
      Requires `ls /sys/kernel/sched_ext` to exist and `systemctl stop scx` if another
      scx scheduler is already running.
  - title: Use on macOS via Lima VM
    body: |
      hello-ebpf requires Linux. On macOS, use the bundled Lima VM config:
      ```bash
      limactl start hello-ebpf.yaml --mount-writable
      limactl shell hello-ebpf sudo bin/install.sh
      limactl shell hello-ebpf
      sudo -s PATH=$PATH   # root required for BPF program loading
      ```
- id: taskcontrol
  group: Scheduling
  tag: poc
  no_release: true
  tagline: eBPF-based Linux scheduler with a REST API for stopping, resuming, and time-planning individual
    tasks and processes at the OS level. Includes a Java client (ThreadControl) for per-thread control
    from within a JVM. Requires Linux 6.13+ and root.
  tagline_short: eBPF Linux scheduler with REST API — stop, resume, and time-plan tasks and processes.
  when_to_use:
  - You want to stop and resume specific processes or JVM threads at the OS scheduler level from Java
  - You need time-based plans (e.g. stop 10s, run 5s, repeat) for fine-grained workload control on Linux
  when_not_to_use:
  - You are on macOS or Windows (Linux only, kernel 6.13+)
  - You want thread priority tuning without stop/resume control — use standard OS priority APIs instead
  install:
  - label: Build from source
    lang: bash
    code: |
      # requires Linux 6.13+, libbpf-dev, clang, Java 23
      git clone https://github.com/parttimenerd/taskcontrol
      cd taskcontrol
      mvn package
  usage:
  - label: REST API
    lang: bash
    code: |
      sudo ./scheduler.sh                                               # start (default port 8087)
      curl "localhost:8087/taskGroup/$(pgrep -f MyApp)?stopping=true"  # stop a process
      curl "localhost:8087/taskGroup/$(pgrep -f MyApp)?stopping=false" # resume it
  - label: Java API
    lang: java
    code: |
      ThreadControl tc = new ThreadControl(); // connects to scheduler on default port 8087
      tc.stopThread(myThread);
      Thread.sleep(5000);
      tc.resumeThread(myThread);
  how_to:
  - title: Stop and resume a process via the REST API
    body: |
      Start the scheduler first (needs root), then use curl with the process PID:
      ```bash
      sudo ./scheduler.sh        # starts on port 8087 by default
      java samples/Ticker.java & # start a sample process
      curl "localhost:8087/taskGroup/$(pgrep -f Ticker)?stopping=true"
      # process stops being rescheduled
      curl "localhost:8087/taskGroup/$(pgrep -f Ticker)?stopping=false"
      # process resumes
      ```
      `taskGroup/{pid}` targets all threads of a process. Use `task/{tid}` for a single thread.
      Check status with a plain GET: `curl localhost:8087/taskGroup/$(pgrep -f Ticker)`
      Returns `running`, `stopping`, or `unknown`.
  - title: Set a stop/run time plan for a process
    body: |
      The `plan` parameter is a comma-separated sequence of items: letter (`s`=stop, `r`=run)
      followed by a number of seconds. Stopping durations must be under 25s each:
      ```bash
      # stop 10s, run 5s, stop 10s, run 10s
      curl "localhost:8087/taskGroup/plan/$(pgrep -f Ticker)?plan=s10,r5,s10,r10"
      ```
      Get the current plan:
      ```bash
      curl "localhost:8087/taskGroup/plan/$(pgrep -f Ticker)"
      ```
      Use `task/plan/{tid}` to target a single thread instead of a whole process.
  - title: Control JVM threads directly from Java
    body: |
      `ThreadControl` maps Java `Thread` objects to OS thread IDs and talks to the running
      scheduler. The scheduler must already be running before constructing `ThreadControl`:
      ```java
      ThreadControl tc = new ThreadControl();         // default port 8087
      // ThreadControl tc = new ThreadControl(9000);  // custom port

      Thread worker = new WorkerThread();
      worker.start();

      System.out.println("OS thread id: " + tc.osId(worker));
      System.out.println("Status: " + tc.getThreadStatus(worker)); // RUNNING, STOPPED, or UNKNOWN

      tc.stopThread(worker);
      Thread.sleep(5000);
      tc.resumeThread(worker);
      ```
  - title: Choose a scheduler and port
    body: |
      ```bash
      sudo ./scheduler.sh -s fifo -p 9000
      ```
      Available schedulers: `fifo` (default), `lottery` (not yet fully implemented).
      Stopping a task for more than 30s will kill the scheduler; keep individual stop durations under 25s.
- id: sound-of-scheduling
  group: Scheduling
  tag: demo
  no_release: true
  tagline: A Linux eBPF scheduler written in Java (via hello-ebpf) that turns task scheduling events into
    music — mapping CPU dispatches and runtime to notes on a musical scale in real time.
  tagline_short: Linux eBPF scheduler that turns task scheduling into music, written in Java.
  links:
  - label: Blog post + video ↗
    url: https://mostlynerdless.de/blog/2025/03/25/hello-ebpf-a-scheduler-controlled-by-sound-20/
  - label: hello-ebpf ↗
    url: https://github.com/parttimenerd/hello-ebpf
  when_to_use:
  - You want a fun demo of what you can build with hello-ebpf and eBPF schedulers
  - You are curious what your Linux scheduler sounds like
  when_not_to_use:
  - You need a production scheduler or performance tool — this is a demo
  install:
  - label: Build from source
    lang: bash
    code: |
      # requires Linux 6.13+, libbpf-dev, clang, Java 23, PulseAudio
      git clone https://github.com/parttimenerd/sound-of-scheduling
      cd sound-of-scheduling
      mvn package
  usage:
  - label: Run
    lang: bash
    code: |
      ./scheduler.sh
      # focus on firefox, faster tempo, scale based on task count:
      ./scheduler.sh --bpm=200 --scale-slice --filter firefox
  how_to:
  - title: Tune the sound and focus on specific processes
    body: |
      Control tempo, musical scale, and which processes to include:
      ```bash
      # 200 BPM, blues scale, only processes with "java" in their name
      ./scheduler.sh --bpm=200 --scale=BLUES --filter java

      # scale the time slice based on number of active tasks
      ./scheduler.sh --scale-slice

      # choose instruments for dispatches vs runtime
      ./scheduler.sh --dispatches-instrument=PIANO --runtime-instrument=STRINGS
      ```
      Available scales: `MAJOR_PENTATONIC`, `MINOR_PENTATONIC`, `BLUES`, `WHOLE_TONE`,
      `HARMONIC_MINOR`, `MELODIC_MINOR`, `HARMONIC_MAJOR`.
  - title: Choose a scheduler type
    body: |
      Three scheduler types are available:
      ```bash
      ./scheduler.sh -t FIFO      # FIFO scheduler (default)
      ./scheduler.sh -t LOTTERY   # lottery scheduler
      ./scheduler.sh -t VTIME     # virtual time scheduler
      ```
      Use `--cores` to limit how many CPU cores the scheduler uses:
      ```bash
      ./scheduler.sh -t VTIME --cores=4
      ```
  note: Requires PulseAudio running at /run/user/1000/pulse/native.
- id: concurrency-fuzz-scheduler
  group: Scheduling
  tag: poc
  no_release: true
  tagline: eBPF-based Linux scheduler written in Java (via hello-ebpf) that fuzzes concurrent applications
    by randomly stopping and starting threads at the kernel level — triggering scheduling edge cases that
    are impossible to reproduce with user-space signals. FOSDEM'25 talk companion.
  tagline_short: Fuzz concurrent Java apps with a custom eBPF scheduler — random stop/start at kernel
    level.
  links:
  - label: Blog post ↗
    url: https://mostlynerdless.de/blog/2026/01/26/reproducing-a-tricky-bug-in-minutes-with-a-custom-linux-scheduler-written-in-java/
  - label: FOSDEM'25 talk ↗
    url: https://fosdem.org/2025/schedule/event/fosdem-2025-4489-concurrency-testing-using-custom-linux-schedulers/
  - label: LWN article ↗
    url: https://lwn.net/SubscriberLink/1007689/922423e440f5e68a/
  - label: hello-ebpf ↗
    url: https://github.com/parttimenerd/hello-ebpf
  when_to_use:
  - You want to reproduce concurrency bugs that only appear under unusual thread interleaving
  - You are testing a concurrent Java application and normal stress testing doesn't trigger the failure
  when_not_to_use:
  - You are on macOS or Windows (Linux only, kernel 6.13+)
  - You need a production-grade fuzzer — this is a proof of concept
  install:
  - label: Build from source
    lang: bash
    code: |
      # requires Linux 6.13+, libbpf-dev, clang, Java 23
      git clone https://github.com/parttimenerd/concurrency-fuzz-scheduler
      cd concurrency-fuzz-scheduler
      mvn package
  usage:
  - label: Fuzz a program
    lang: bash
    code: |
      ./scheduler.sh <script-or-command>
      # focus on Java threads, log state changes:
      ./scheduler.sh samples/run_queue.sh --java --log
  how_to:
  - title: Fuzz a concurrent program until it fails
    body: |
      Pass the script or command to run as the positional argument. The scheduler randomly stops
      and resumes threads, restarting the program each iteration until it exits with a non-zero
      exit code:
      ```bash
      ./scheduler.sh samples/run_queue.sh --java --log
      ```
      `--java` focuses the random scheduling on Java application threads (skips JVM internals).
      `--log` prints each stop/run state change with timestamps so you can see what triggered the crash.

      Default ranges: sleep `10ms–2000ms`, run `1ms–100ms`. Use `--max-iterations` to cap the run:
      ```bash
      ./scheduler.sh my_test.sh --java --max-iterations=50
      ```
  - title: Tune the run/sleep ranges
    body: |
      Control how aggressively threads are interrupted with `--run` and `--sleep` ranges:
      ```bash
      # run threads for 5–50ms, sleep them for 100–500ms
      ./scheduler.sh my_program --run=5ms,50ms --sleep=100ms,500ms
      ```
      Set a per-iteration timeout — treated as a failure if the program doesn't finish in time:
      ```bash
      ./scheduler.sh my_program --timeout=60
      ```
  - title: Use a custom error detection script
    body: |
      By default any non-zero exit code is treated as a failure. Supply `--error-command` to run
      a custom detection script at each check interval — the script signals failure by exiting
      with code 0 (success means "error found"):
      ```bash
      ./scheduler.sh my_program --error-command="grep -q 'ERROR' app.log"
      # grep exits 0 when it finds the pattern — that triggers failure detection
      ```
      Control how often the check runs (default 10s):
      ```bash
      ./scheduler.sh my_program --error-command="./check.sh" --error-check-interval=1s
      ```
- id: check-language-version
  group: Misc
  tag: experimental
  tagline: Static analyser that scans your Java source tree and reports the minimum language level each
    file actually requires, so you know exactly what is preventing you from lowering --release.
  tagline_short: Find what's blocking a --release downgrade — per-file minimum Java version from syntax
    analysis.
  when_to_use:
  - You want to lower your project's --release target and need to know what's blocking it
  - You are auditing a multi-module project for language-level inconsistencies
  - You want a quick per-file breakdown before a Java version migration
  features:
  - Per-file minimum Java version detection from Java 1.0 through 21+
  - Detects syntax features: lambdas, records, sealed classes, switch expressions, text blocks, var, pattern
      matching
  - Summary table across all files
  - JSON output for scripting and aggregation across multiple runs
  - visualize.py for chart generation from JSON output
  no_release: true
  install:
  - label: Build from source
    lang: bash
    code: |
      git clone https://github.com/parttimenerd/check-language-version
      cd check-language-version
      mvn package
      # JAR: target/check-language-version.jar
  usage:
  - label: Scan a directory
    lang: bash
    code: |
      java -jar check-language-version.jar src/main/java/
      java -jar check-language-version.jar src/main/java/ --summary --verbose
  how_to:
  - title: Find what's preventing a --release downgrade
    body: |
      Run against your source tree, then use `--summary` to see the highest version required
      across all files and which features are responsible:
      ```bash
      java -jar check-language-version.jar src/main/java/ --summary
      ```
      Drill into individual files with `--verbose` to see exactly which syntax triggered the version:
      ```bash
      java -jar check-language-version.jar src/main/java/MyClass.java --verbose
      ```
  - title: Export to JSON and visualize across multiple modules
    body: |
      Capture per-file results as JSON for scripting or cross-module aggregation:
      ```bash
      java -jar check-language-version.jar src/ --json > module-a.json
      java -jar check-language-version.jar other/src/ --json > module-b.json
      ```
      Aggregate into a single summary table:
      ```bash
      java -jar check-language-version.jar summary module-a.json module-b.json
      ```
      Generate charts with the bundled script:
      ```bash
      python3 visualize.py module-a.json module-b.json --output-dir charts --open
      ```
  note: Syntax-only — does not detect API-level features like virtual threads (used via method calls,
    not syntax).
- id: local-android-ai
  group: Misc
  tag: experimental
  tagline: Android app that serves local AI models and device sensors over a REST API on port 8005. Supports
    on-device LLM inference (Gemma, Llama, DeepSeek, TinyLlama via MediaPipe), object detection, camera
    capture, and compass orientation — designed for integration with Android terminals or K3s nodes.
  tagline_short: Android app serving local LLM inference and device sensors over a REST API.
  when_to_use:
  - You want to run LLM inference or object detection on an Android device and access it from another
    app or script
  - You are running Android devices as K3s cluster nodes and need AI/sensor APIs for cluster applications
  when_not_to_use:
  - You need cloud-based AI inference — this runs fully on-device
  - Your device has less than 3 GB RAM (required for AI features)
  install:
  - label: Download APK
    lang: bash
    code: |
      # Download from the Releases page and install:
      adb install -r local-android-ai.apk
  - label: Build from source
    lang: bash
    code: |
      git clone https://github.com/parttimenerd/local-android-ai
      cd local-android-ai
      ./gradlew assembleDebug
      adb install -r app/build/outputs/apk/debug/app-debug.apk
  usage:
  - label: Query the API
    lang: bash
    code: |
      # LLM inference (runs on-device, port 8005):
      curl -X POST http://<phone-ip>:8005/ai/text \
        -H "Content-Type: application/json" \
        -d '{"text": "Hello!", "model": "GEMMA_3_1B_IT"}'
  how_to:
  - title: Run LLM inference
    body: |
      Use the enum name or display name as the `model` field. Available models:

      | Model name | Identifier | Vision |
      |---|---|---|
      | Gemma 3n E2B IT | `GEMMA_3_1B_IT` | yes |
      | DeepSeek-R1 Distill Qwen 1.5B | `DEEPSEEK_R1_DISTILL_QWEN_1_5B` | no |
      | Llama 3.2 1B Instruct | `LLAMA_3_2_1B_INSTRUCT` | no |
      | Llama 3.2 3B Instruct | `LLAMA_3_2_3B_INSTRUCT` | no |
      | TinyLlama 1.1B Chat | `TINYLLAMA_1_1B_CHAT` | no |

      Download a model first via the app UI or API, then query it:
      ```bash
      # Download a model
      curl -X POST http://<phone-ip>:8005/ai/models/download \
        -H "Content-Type: application/json" \
        -d '{"modelName": "GEMMA_3_1B_IT"}'

      # Run inference
      curl -X POST http://<phone-ip>:8005/ai/text \
        -H "Content-Type: application/json" \
        -d '{"text": "Explain eBPF in one sentence", "model": "GEMMA_3_1B_IT", "maxTokens": 150}'
      ```
      Gemma 3n E2B IT supports image input — pass a base64-encoded image in the `image` field,
      or use `captureConfig` to capture directly from the camera.
  - title: Run object detection
    body: |
      Uses MediaPipe EfficientDet Lite 2. The app must be visible for camera capture
      (Android OS privacy restriction):
      ```bash
      curl -X POST http://<phone-ip>:8005/ai/object_detection \
        -H "Content-Type: application/json" \
        -d '{"side": "rear", "threshold": 0.6, "maxResults": 5, "returnImage": false}'
      ```
      Set `returnImage: true` to include a base64-encoded JPEG of the captured frame in the response.
  - title: Read device sensors
    body: |
      Get compass orientation (azimuth, pitch, roll) and camera snapshots:
      ```bash
      # Compass orientation
      curl http://<phone-ip>:8005/orientation

      # Camera snapshot (app must be in foreground)
      curl "http://<phone-ip>:8005/capture?side=rear&zoom=2.0"

      # Server status, permissions, memory usage
      curl http://<phone-ip>:8005/status

      # Full API docs
      curl http://<phone-ip>:8005/help
      ```
  note: Highly experimental. Camera capture requires the app to be visible due to Android OS privacy restrictions.
