- id: temci
  tag: ready
  group: "Misc"
  tagline: "Advanced benchmarking tool with statistical rigour, noise reduction, and report generation."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You need statistically sound micro-benchmarks with noise isolation
    - You want automated comparison reports across benchmark runs
  when_not_to_use:
    - You need JVM-native benchmarking (use JMH instead)
    - You are on Windows (Linux/macOS only)
  vs: ~
  related: []
  links:
    - { label: "Docs ↗", url: "https://temci.readthedocs.io" }
  no_release: false
  install:
    - label: pip
      lang: bash
      code: "pip install temci"
  usage:
    - label: Run benchmark
      lang: bash
      code: |
        temci exec --runs 20 "my_program arg1"
        temci report result.yaml
  note: ""
