- id: check-language-version
  tag: experimental
  group: "Misc"
  tagline: "Check which Java language level each source file in your project actually requires."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You want to lower your project's --release target and need to know what's blocking it
    - You are auditing a multi-module project for language-level inconsistencies
  when_not_to_use:
    - You need a full static analysis tool
  vs: ~
  related: []
  links: []
  no_release: false
  install:
    - label: Download
      lang: bash
      code: |
        gh release download --repo parttimenerd/check-language-version \
          --pattern '*.jar' -D .
        java -jar check-language-version.jar src/
  usage:
    - label: Check
      lang: bash
      code: |
        java -jar check-language-version.jar src/main/java/
  note: ""

