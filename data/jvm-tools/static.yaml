- id: jfr-query
  group: JFR / Profiling
  tag: experimental
  tagline: Turns JFR recordings and JDK unified log files (GC logs) into a DuckDB database and exposes
    them through an in-browser notebook UI. Write SQL, get charts, explore event distributions, and use
    built-in views for common analyses — no install needed. Use it for ad-hoc investigation when you want
    to correlate events across types (GC, allocations, CPU) in a single query.
  tagline_short: SQL notebook for JFR recordings and JDK GC logs — drag in a file, write SQL, get charts.
  github_pages: https://parttimenerd.github.io/jfr-query/
  when_to_use:
  - You want to run ad-hoc SQL queries over JFR event data or JDK unified log files (GC logs)
  - You need charts and notebook-style exploration of recordings
  - You want to correlate events across types (GC, allocations, CPU) in one query
  - You need to share a JFR analysis without requiring the recipient to install anything
  when_not_to_use:
  - You need a stable, production-ready tool (schema may change between versions)
  - You need IDE integration (use the profiler plugin instead)
  - You have very large recordings — DuckDB runs in-browser via WASM, memory-constrained
  links:
  - label: Docs ↗
    url: https://parttimenerd.github.io/jfr-query/docs/
  install:
  - label: Download JAR
    lang: bash
    code: |
      gh release download --repo parttimenerd/jfr-query \
        --pattern '*.jar' --dir .
  - label: jbang
    lang: bash
    code: |
      jbang jfr-query@parttimenerd/jfr-query
  usage:
  - label: Notebook UI
    lang: bash
    code: |
      java -jar query.jar serve myrecording.jfr
      # opens http://localhost:4244
  - label: CLI query
    lang: bash
    code: |
      java -jar query.jar query myrecording.jfr "hot-methods"
  how_to:
  - title: Explore a recording in the browser without installing anything
    body: |
      Visit **[parttimenerd.github.io/jfr-query](https://parttimenerd.github.io/jfr-query/)**
      and drag-and-drop your `.jfr` file. The app runs entirely in-browser via DuckDB WASM —
      no data leaves your machine.

      Use **New from template** to open ready-made notebooks for GC analysis, heap allocation,
      threading, and exceptions.
  - title: Find the hottest methods from the command line
    body: |
      ```bash
      java -jar query.jar query myrecording.jfr "hot-methods"
      ```
      `hot-methods` is a built-in view. List all available views and macros:
      ```bash
      java -jar query.jar views
      java -jar query.jar macros
      ```
  - title: Import once, query many times with DuckDB
    body: |
      ```bash
      # Import the recording into a persistent .db file:
      java -jar query.jar import myrecording.jfr mydb.db

      # Query it directly with DuckDB CLI:
      duckdb mydb.db "SELECT * FROM hot_methods"

      # Or open DuckDB's own browser UI:
      duckdb -ui mydb.db
      ```
      Useful when you want to run many queries without re-parsing the JFR file each time.
  - title: Analyse GC logs (JDK unified log format)
    body: |
      jfr-query also accepts JDK unified log files (the output of `-Xlog:gc*:file=gc.log`):
      ```bash
      java -jar query.jar serve gc.log
      # or in the browser: drag-and-drop a .log file
      ```
      Built-in GC log templates cover pause analysis, heap pressure, and allocation rate.
      Use the **New from template** button and select a GC log notebook.
  - title: Start the notebook server with custom templates
    body: |
      ```bash
      java -jar query.jar serve \
        --templates-dir ~/my-jfr-templates \
        --port 4244 \
        myrecording.jfr
      ```
      Point `--templates-dir` at a folder of `.json` notebook files to share team-wide analysis
      templates. The AI assistant (Gemini/OpenAI) can be enabled via environment variables —
      see the [docs](https://parttimenerd.github.io/jfr-query/docs/) for configuration.
  note: Runs entirely in-browser via DuckDB WASM — no data leaves your machine. Very large recordings
    (>500 MB) may be slow due to browser memory limits. Stack traces are stored at 10 frames depth.
- id: condensed-data
  group: JFR / Profiling
  tag: experimental
  maven_coordinates: me.bechberger.condensed:condensed-data
  tagline: CLI tool and Java agent for long-term, low-overhead JFR event storage. Records events from
    a running JVM via live-attach and compresses them into the self-describing .cjfr format — significantly
    smaller than raw JFR. Supports rotating files, configurable compression, and a reader library for
    querying stored data. View .cjfr files in jfr-query or the JMC fork with native .cjfr support.
  tagline_short: CLI tool and agent for compact long-term JFR event storage — significantly smaller than
    raw .jfr.
  github_pages: https://parttimenerd.github.io/condensed-data/
  when_to_use:
  - You need long-term storage of JFR recordings with minimal disk usage
  - You want live-attach to a running JVM for continuous event capture
  - You are storing GC or other continuous JFR data over days or weeks
  - You want a self-describing format readable without the original JDK
  when_not_to_use:
  - You need immediate full JFR replay compatibility without a reader library
  - You need a stable format (early development, .cjfr format may change)
  - You need Windows support (live-attach agent is Linux/macOS only)
  links:
  - label: Docs ↗
    url: https://parttimenerd.github.io/condensed-data/
  - label: JMC fork with .cjfr support ↗
    url: https://github.com/parttimenerd/jmc/releases/tag/snapshot
  install:
  - label: Download JAR
    lang: bash
    code: |
      gh release download --repo parttimenerd/condensed-data \
        --pattern '*.jar' --dir .
      # See docs/jar-releases.md for which JAR variant to pick
  usage:
  - label: Basic Usage
    lang: bash
    code: |
      # Attach to a running JVM (by PID) and start recording:
      java -jar condensed-data.jar agent <PID> start recording.cjfr

      # Condense existing JFR files to .cjfr:
      java -jar condensed-data.jar condense myrecording.jfr output.cjfr
  how_to:
  - title: Attach to a running JVM and record continuously
    body: |
      ```bash
      # Start recording to a single file:
      java -jar condensed-data.jar agent <PID> start recording.cjfr

      # Check status:
      java -jar condensed-data.jar agent <PID> status

      # Stop and finalize:
      java -jar condensed-data.jar agent <PID> stop
      ```
      `<PID>` can also be a main-class name filter or `all` to target all matching JVMs.
  - title: Record with rotating files (production use)
    body: |
      Keep at most 3 files of 100 MB each — old files are overwritten:
      ```bash
      java -jar condensed-data.jar agent <PID> start \
        --rotating --max-size=100m --max-files=3 \
        recording_$index.cjfr
      ```
      Or start via `-javaagent` at JVM launch (comma-separated, no dashes):
      ```bash
      java -javaagent:condensed-data.jar=start,rotating,max-size=100m,max-files=3,recording.cjfr \
        -jar myapp.jar
      ```
  - title: Condense existing JFR files
    body: |
      ```bash
      # Single file:
      java -jar condensed-data.jar condense myrecording.jfr output.cjfr

      # Whole folder or ZIP:
      java -jar condensed-data.jar condense recordings/ output.cjfr

      # Inflate back to JFR for tools that don't support .cjfr:
      java -jar condensed-data.jar inflate output.cjfr restored.jfr
      ```
  - title: View events and summaries
    body: |
      ```bash
      # Print a summary:
      java -jar condensed-data.jar summary recording.cjfr

      # Use JFR named views (gc-pauses, hot-methods, allocation-by-site, …):
      java -jar condensed-data.jar view recording.cjfr gc-pauses

      # Open in jfr-query notebook UI:
      java -jar query.jar serve recording.cjfr
      # or drag-and-drop onto https://parttimenerd.github.io/jfr-query/
      ```
  - title: Open in JDK Mission Control
    body: |
      A [JMC fork](https://github.com/parttimenerd/jmc) supports native `.cjfr` files —
      no inflation step required:
      ```bash
      # Download snapshot build from:
      # https://github.com/parttimenerd/jmc/releases/tag/snapshot
      # Then open JMC and File > Open > select your .cjfr file
      ```
      Or inflate first if you need the standard JMC release:
      ```bash
      java -jar condensed-data.jar inflate recording.cjfr recording.jfr
      ```
  note: No stable release yet — rolling snapshots only. Check docs/jar-releases.md for which JAR variant
    to download for your environment.
- id: tiny-profiler
  group: JFR / Profiling
  tag: demo
  no_release: true
  tagline: Educational sampling CPU profiler for Java written in pure Java 17. Uses Thread.getAllStackTraces()
    to sample stacks and outputs a method table and an HTML flame graph. Safepoint-biased by design —
    intended to demystify how profilers work, not for production use.
  tagline_short: Educational Java CPU profiler — method table and HTML flame graph, no native code.
  when_to_use:
  - You want to understand how a sampling profiler works from first principles
  - You need a quick profiler with no native dependencies on any platform
  when_not_to_use:
  - You need accurate profiling — safepoint-biased, misses async and JIT-compiled hot paths
  - You need production profiling — use async-profiler or JFR instead
  links:
  - label: Blog post ↗
    url: https://mostlynerdless.de/blog/2023/03/27/writing-a-profiler-in-240-lines-of-pure-java/
  install:
  - label: Build from source
    lang: bash
    code: |
      git clone https://github.com/parttimenerd/tiny-profiler
      cd tiny-profiler
      mvn package
  usage:
  - label: Profile an app
    lang: bash
    code: |
      java -javaagent:target/tiny-profiler.jar=flamegraph=flame.html YourApp
      # interval=10 (ms) is the default; override with interval=5
      java -javaagent:target/tiny-profiler.jar=flamegraph=flame.html,interval=5 YourApp
  note: Safepoint-biased — only samples at JVM safepoints, so CPU-heavy native or JIT code may be underrepresented.
- id: hprof-analyzer
  group: Heap Dump Analysis
  tag: experimental
  tagline: Fast heap dump analyser (Rust + Java CLI). Reproduces Eclipse MAT's System Overview, Leak Suspects,
    Top Consumers, and Threads views with a fraction of the memory overhead. Handles dumps larger than
    10 GiB that MAT cannot open. Also ships an OQL query engine, an HTTP server for programmatic access,
    a redact subcommand to zero sensitive data before sharing, and an in-browser WASM UI for dumps up
    to 3 GiB.
  tagline_short: Fast Rust-based heap dump analyser — handles >10 GiB dumps, OQL shell, browser UI.
  cargo_crate: hprof-analyzer
  github_pages: https://parttimenerd.github.io/hprof-analyzer/
  when_to_use:
  - You need to analyse a heap dump without Eclipse MAT's memory overhead
  - You have a very large heap dump (>10 GiB) that MAT cannot handle
  - You want a quick in-browser analyser for smaller dumps (WASM, memory-limited by browser)
  - You want Leak Suspects, Top Consumers, and thread views without a GUI IDE
  - You need scriptable, CI-friendly heap analysis (JSON output, diff two dumps)
  when_not_to_use:
  - You need full interactive MAT-style object graph exploration (use Eclipse MAT)
  - You need Windows support (native binary is currently Linux/macOS only)
  links:
  - label: Web analyser ↗
    url: https://parttimenerd.github.io/hprof-analyzer/
  - label: Sample report ↗
    url: https://parttimenerd.github.io/hprof-analyzer/reports/
  install:
  - label: Homebrew
    lang: bash
    code: |
      brew tap parttimenerd/hprof-analyzer
      brew trust parttimenerd/hprof-analyzer  # required once for third-party taps
      brew install hprof-analyzer
  - label: macOS (arm64)
    lang: bash
    code: |
      curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-aarch64-apple-darwin.tar.gz | tar xz
      sudo mv hprof-analyzer-*/hprof-analyzer /usr/local/bin/
  - label: Linux (x86_64)
    lang: bash
    code: |
      curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz | tar xz
      sudo mv hprof-analyzer-*/hprof-analyzer /usr/local/bin/
  - label: cargo
    lang: bash
    code: |
      cargo install hprof-analyzer
  usage:
  - label: Basic Usage
    lang: bash
    code: |
      hprof-analyzer heap.hprof report.html
  how_to:
  - title: Analyse a heap dump and open the report
    body: |
      ```bash
      hprof-analyzer heap.hprof report.html
      ```
      Opens a self-contained HTML file with System Overview, Leak Suspects,
      Top Consumers, and Threads — no server, no external assets.

      Compressed dumps are read transparently:
      ```bash
      hprof-analyzer heap.hprof.gz report.html
      hprof-analyzer heap.hprof.zip report.html
      ```
      **Tip:** use `-XX:+HeapDumpGzip` to write compressed dumps directly — typically 5–10× smaller.

      Update to the latest nightly build at any time:
      ```bash
      hprof-analyzer update nightly
      ```
  - title: Analyse in the browser without installing anything
    body: |
      Visit **[parttimenerd.github.io/hprof-analyzer](https://parttimenerd.github.io/hprof-analyzer/)**
      and drag-and-drop your `.hprof` file. Runs entirely via WebAssembly — no data leaves your machine.
      Performance depends on available browser memory; it may work fine above 3 GiB or struggle below
      it depending on your machine. For large or slow dumps use the native binary instead.
  - title: Run OQL queries — CLI REPL or browser
    body: |
      Interactive REPL in the terminal with tab-completion:
      ```bash
      hprof-analyzer query heap.hprof --repl
      ```
      Or start a local server and use the browser OQL shell:
      ```bash
      hprof-analyzer server heap.hprof
      # → open http://127.0.0.1:7070
      ```
      ```
      /help oql        — full OQL language reference
      /examples        — guided tour of OQL examples by category
      ```
      The OQL dialect is modelled on Eclipse MAT's — most MAT queries work unchanged.
  - title: Use with Claude or Cline via MCP
    body: |
      hprof-analyzer ships a built-in MCP server so Claude, Cline, and other
      MCP-compatible AI assistants can analyse heap dumps directly.

      **Claude Code:**
      ```bash
      claude mcp add hprof -- hprof-analyzer mcp
      ```
      **Cline (VS Code)** — add to `.vscode/mcp.json`:
      ```json
      { "mcpServers": { "hprof": { "command": "hprof-analyzer", "args": ["mcp"] } } }
      ```
      Homebrew prints full MCP setup instructions after install.
  - title: Redact a dump before sharing
    body: |
      Heap dumps contain sensitive data — string values, field values, serialized objects.
      The `redact` subcommand zeroes all primitive values and array contents while preserving
      class/field/method names, producing a dump safe to attach to a bug report or share with colleagues:
      ```bash
      hprof-analyzer redact heap.hprof redacted.hprof
      ```
      hprof-analyzer detects redacted dumps automatically and shows a "Redacted dump" banner
      in the report, skipping analyses that would be meaningless on zeroed data.
  - title: Generate Eclipse MAT cache files (speed up first MAT open)
    body: |
      For large dumps MAT's first parse can peak at ~55 GiB RSS. hprof-analyzer generates
      the same cache files with much lower memory usage:
      ```bash
      hprof-analyzer mat caches heap.hprof /path/to/heap-dir/
      ```
      Open `heap.hprof` in MAT as usual — it detects the cache and skips the expensive first parse.
  note: Native binary requires Linux or macOS. The in-browser WASM version is memory-limited by the browser
    — it may work for larger dumps or struggle for smaller ones depending on your machine.
- id: hprof-redact
  group: Heap Dump Analysis
  tag: poc
  maven_coordinates: me.bechberger:hprof-redact
  tagline: Deprecated standalone redaction tool — the `hprof-analyzer redact` subcommand now supersedes
    this for CLI use. The underlying stream-based library (zeroes string contents and primitive values
    without loading the full file into memory) remains available for programmatic pipeline integration,
    e.g. CF plugin tooling.
  tagline_short: Deprecated — use `hprof-analyzer redact` instead. Library available for programmatic
    pipeline use.
  when_to_use:
  - You are building tooling that needs to redact heap dumps programmatically (library use)
  when_not_to_use:
  - You want to redact a dump interactively — use hprof-analyzer's built-in redact subcommand instead
  - You need guaranteed complete privacy — not security-audited
  related:
  - label: hprof-analyzer
    url: https://github.com/parttimenerd/hprof-analyzer
  install:
  - label: Maven
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>hprof-redact</artifactId>
        <version>VERSION</version>
      </dependency>
  usage:
  - label: Standalone redaction (via hprof-analyzer)
    lang: bash
    code: |
      hprof-analyzer redact input.hprof redacted.hprof
  - label: Library use
    lang: java
    code: |
      HprofRedactor.redact(Path.of("input.hprof"), Path.of("redacted.hprof"));
  how_to:
  - title: Redact a heap dump before sharing
    body: |
      For standalone use, call `hprof-analyzer redact` — it uses this library internally
      and is the recommended way to redact without writing code:
      ```bash
      hprof-analyzer redact heap.hprof redacted.hprof
      ```
      The redacted dump zeroes all string values and primitive field contents while keeping
      class/field/method names intact. hprof-analyzer detects it automatically and shows
      a "Redacted dump" banner in the report.
  - title: Redact programmatically in a pipeline
    body: |
      Add the Maven dependency and call `HprofRedactor.redact()` in a stream pipeline —
      the library never loads the full dump into memory:
      ```java
      import me.bechberger.HprofRedactor;
      import java.nio.file.Path;

      HprofRedactor.redact(
          Path.of("heap.hprof"),
          Path.of("heap-redacted.hprof")
      );
      ```
      Use this when building CF plugin tooling or any pipeline that needs to strip sensitive
      data before uploading a dump to a remote system.
  note: Deprecated for standalone use — `hprof-analyzer redact` supersedes this. Library is still usable
    for programmatic pipeline integration. Not security-audited — review before using for compliance purposes.
