  tagline_short: Wrap a fat JAR into a directly executable file on Linux/macOS — no launcher script needed.
  when_to_use:
  - You want users to run your tool directly without typing `java -jar`
  - You need a single self-contained executable with no launcher script
  when_not_to_use:
  - You need JAR size reduction (use femtojar instead)
  - You are packaging a library rather than an executable
  install:
  - label: Maven plugin
    lang: xml
    code: |
      <plugin>
        <groupId>me.bechberger</groupId>
        <artifactId>execjar-maven-plugin</artifactId>
        <version>VERSION</version>
        <executions>
          <execution>
            <goals><goal>execjar</goal></goals>
          </execution>
        </executions>
      </plugin>
  usage:
  - label: Build
    lang: bash
    code: |
      mvn package
      ./target/yourapp.run
- id: meta-agent
  tag: experimental
  group: Agent Development
  maven_coordinates: me.bechberger:meta-agent
  tagline: Java agent that wraps another agent and intercepts its ClassFileTransformer calls. Lets you
    see exactly which classes get transformed, what the bytecode looks like before and after, and how
    long each transformation takes. Use it when you are building or debugging a Java agent and need to
    see what it actually does to class files.
  tagline_short: Wrap any Java agent and inspect every class transformation it performs.
  when_to_use:
  - You need to understand or debug what a Java agent is doing to class files
  - You are developing or testing a ClassFileTransformer and need visibility into its behaviour
  when_not_to_use:
  - You need a production-safe monitoring tool
  - You want end-user JVM observability (use jstall instead)
  install:
  - label: Maven
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>meta-agent</artifactId>
        <version>VERSION</version>
      </dependency>
  usage:
  - label: Attach as agent
    lang: bash
    code: |
      java -javaagent:meta-agent.jar=<target-agent.jar> \
        -jar yourapp.jar
- id: jthreaddump
  tag: ready
  group: Libraries
  maven_coordinates: me.bechberger:jthreaddump
  tagline: Java library for parsing thread dump output from jstack and jcmd into a typed model. Handles
    all major thread dump formats across JDK versions, including virtual threads, giving you structured
    access to thread states, stack frames, and lock information. Use it when you are building tooling
    that processes or compares thread dumps programmatically.
  tagline_short: Parse jstack/jcmd thread dumps into a structured Java model — all JDK formats supported.
  when_to_use:
  - You need to programmatically parse and analyse Java thread dumps
  - You are building tooling that processes jstack or jcmd output
  - You want to diff thread dumps or detect recurring blocking patterns
  when_not_to_use:
  - You need live thread inspection (use jstall instead)
  - You need profiling data (use the JFR profiling tools instead)
  install:
  - label: Maven
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>jthreaddump</artifactId>
        <version>VERSION</version>
      </dependency>
  - label: Gradle
    lang: groovy
    code: implementation 'me.bechberger:jthreaddump:VERSION'
  usage:
  - label: Parse dump
    lang: java
    code: |
      ThreadDump dump = ThreadDumpParser.parse(Files.readString(path));
      System.out.println("Threads: " + dump.threads().size());
      for (var thread : dump.threads()) {
          System.out.println(thread.name() + " - " + thread.state());
      }
      if (dump.deadlockInfos() != null && !dump.deadlockInfos().isEmpty()) {
          System.out.println("Deadlocks detected!");
      }
  - label: Capture + parse
    lang: java
    code: |
      String raw = JStackUtil.captureThreadDump(pid);
      ThreadDump dump = ThreadDumpParser.parse(raw);
  - label: CLI
    lang: bash
    code: |
      jthreaddump dump.txt      # parse and display summary
      jstack 12345 | jthreaddump -   # read from stdin
