- id: tiny-profiler
  tag: demo
  group: "JFR / Profiling"
  tagline: "Educational sampling profiler for Java 17+, written entirely in Java. Uses Thread.getAllStackTraces() to collect samples and outputs method tables and interactive HTML flamegraphs via d3-flame-graph. Simple enough to read in an afternoon."
  tagline_short: "Educational Java profiler — pure Java, flamegraph output, reads in an afternoon."
  screenshot: ""
  static_version: ""
  features:
    - Pure Java — no native code, no JVM agents, no setup beyond a JAR
    - Outputs method tables and interactive HTML flamegraphs (d3-flame-graph)
    - Safepoint-biased sampling via Thread.getAllStackTraces() — intentionally simple
    - Small enough to read the entire source in a single sitting
  when_to_use: ~
  when_not_to_use: ~
  vs: ~
  related:
    - { label: "writing-a-profiler", url: "https://github.com/parttimenerd/writing-a-profiler" }
  links:
    - { label: "Blog series ↗", url: "https://mostlynerdless.de/blog/category/profiling/" }
  no_release: true
  install:
    - label: Build
      lang: bash
      code: |
        git clone https://github.com/parttimenerd/tiny-profiler
        cd tiny-profiler && mvn package
  usage:
    - label: Profile
      lang: bash
      code: |
        java -javaagent:target/tiny-profiler.jar=flamegraph=flames.html \
          -jar yourapp.jar
        # Opens flames.html with an interactive flamegraph
  note: "Safepoint-biased — good for learning, not for production profiling decisions."

