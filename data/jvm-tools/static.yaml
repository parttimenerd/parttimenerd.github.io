- id: hprof-analyzer
  tag: experimental
  group: "Heap Dump Analysis"
  tagline: "Fast CLI heap dump analyzer: System Overview, Leak Suspects, Top Consumers, Threads."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You need to analyze a heap dump without Eclipse MAT's memory overhead
    - You have a very large heap dump (>10 GiB) that MAT cannot handle
    - You want a quick in-browser analyzer for smaller dumps (up to 3 GiB)
  when_not_to_use:
    - You need full MAT feature coverage (OQL queries, custom reports)
    - You need Windows support (native binary currently linux/mac only)
  vs: ~
  related: []
  links:
    - { label: "Web analyzer ↗", url: "https://parttimenerd.github.io/hprof-analyzer/" }
  no_release: false
  install:
    - label: Download
      lang: bash
      code: |
        curl -L https://github.com/parttimenerd/hprof-analyzer/releases/latest/download/hprof-analyzer \
          -o hprof-analyzer && chmod +x hprof-analyzer
        ./hprof-analyzer heap.hprof
  usage:
    - label: Analyze dump
      lang: bash
      code: |
        ./hprof-analyzer heap.hprof
        ./hprof-analyzer heap.hprof --leak-suspects
  note: ""

