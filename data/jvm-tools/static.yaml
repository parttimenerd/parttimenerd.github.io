- id: test-order
  tag: experimental
  group: "Testing"
  tagline: "Maven and Gradle plugin that reorders your test suite so tests covering recently changed code run first. Uses bytecode instrumentation to track class-to-test coverage, then on the next run promotes affected tests to the front — without any annotations or configuration."
  tagline_short: "Runs the tests most likely to fail first, based on your recent code changes."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You want faster feedback in CI by surfacing relevant failures early
    - Your test suite is large enough that waiting for the full run hurts productivity
    - You want zero-config test prioritisation with Maven or Gradle
  when_not_to_use:
    - You need cross-module coverage tracking (single-module only for now)
    - You are not using Maven or Gradle
  vs: ~
  related: []
  links:
    - { label: "Docs ↗", url: "https://parttimenerd.github.io/test-order/" }
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <plugin>
          <groupId>me.bechberger</groupId>
          <artifactId>test-order-maven-plugin</artifactId>
          <version>VERSION</version>
          <extensions>true</extensions>
          <executions>
            <execution>
              <goals><goal>prepare</goal></goals>
            </execution>
          </executions>
        </plugin>
  usage:
    - label: Run tests
      lang: bash
      code: |
        mvn test          # first run: learns coverage
        mvn test          # second run: affected tests go first
        mvn test-order:show      # inspect ranking
        mvn test-order:dashboard # HTML report
  note: ""

- id: jthreaddump
  tag: ready
  group: "Libraries"
  tagline: "Java library for parsing thread dump output from jstack and jcmd into a typed model. Handles all major thread dump formats across JDK versions, including virtual threads, giving you structured access to thread states, stack frames, and lock information."
  tagline_short: "Parse jstack/jcmd thread dumps into a typed Java model."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You need to programmatically parse and analyse Java thread dumps
    - You are building tooling that processes jstack or jcmd output
    - You want to diff thread dumps or detect recurring blocking patterns
  when_not_to_use:
    - You need live thread inspection (use jstall instead)
    - You need profiling data (use the JFR profiling tools instead)
  vs: ~
  related: []
  links: []
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <dependency>
          <groupId>me.bechberger</groupId>
          <artifactId>jthreaddump</artifactId>
          <version>VERSION</version>
        </dependency>
    - label: Gradle
      lang: groovy
      code: "implementation 'me.bechberger:jthreaddump:VERSION'"
  usage:
    - label: Parse dump
      lang: java
      code: |
        ThreadDump dump = ThreadDumpParser.parse(Files.readString(path));
        dump.getThreads().forEach(t ->
            System.out.println(t.getName() + ": " + t.getState()));
  note: ""
