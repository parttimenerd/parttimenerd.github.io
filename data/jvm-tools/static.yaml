- id: test-order
  tag: experimental
  group: Testing
  maven_coordinates: me.bechberger:test-order-maven-plugin
  tagline: Maven and Gradle plugin that reorders your test suite so tests covering recently changed code
    run first. Uses bytecode instrumentation to track class-to-test coverage, then on the next run promotes
    affected tests to the front. Use it when your suite is large enough that waiting for the full run
    hurts productivity and you want zero-config test prioritisation.
  tagline_short: Run the tests most likely to fail first — zero-config test prioritisation for Maven/Gradle.
  github_pages: https://parttimenerd.github.io/test-order/
  when_to_use:
  - You want faster feedback in CI by surfacing relevant failures early
  - Your test suite is large enough that waiting for the full run hurts productivity
  - You want zero-config test prioritisation with Maven or Gradle
  when_not_to_use:
  - You need cross-module coverage tracking (single-module only for now)
  - You are not using Maven or Gradle
  links:
  - label: Docs ↗
    url: https://parttimenerd.github.io/test-order/
  install:
  - label: Maven
    lang: xml
    code: |
      <plugin>
        <groupId>me.bechberger</groupId>
        <artifactId>test-order-maven-plugin</artifactId>
        <version>VERSION</version>
        <extensions>true</extensions>
        <executions>
          <execution>
            <goals><goal>prepare</goal></goals>
          </execution>
        </executions>
      </plugin>
  usage:
  - label: Run tests
    lang: bash
    code: |
      mvn test          # first run: learns coverage
      mvn test          # second run: affected tests go first
      mvn test-order:show      # inspect ranking
      mvn test-order:dashboard # HTML report
- id: execjar
  tag: experimental
  group: JAR Packaging
  tagline: CLI tool and Maven plugin that wraps a fat JAR in a small shell stub, producing a single self-contained
    file that is directly executable on Linux and macOS without a launcher script or explicit java -jar
    invocation. Use it when you want users to run your tool as a plain command without thinking about
