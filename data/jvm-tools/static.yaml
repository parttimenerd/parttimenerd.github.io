- id: jfr-profiling
  tag: ready
  group: "JFR / Profiling"
  tagline: "JFR-based profiling ecosystem: convert, view, and analyze JFR recordings in Firefox Profiler and IntelliJ."
  screenshot: "https://mostlynerdless.de/wp-content/uploads/2023/01/Screenshot-2023-01-27-at-12.31.55-2048x1230.png"
  static_version: "2026-07"
  when_to_use:
    - You want to view JFR recordings as flame graphs in the Firefox Profiler UI
    - You want JFR profiling integrated directly into IntelliJ IDEA
    - You need to share or embed profiling results as a web link
  when_not_to_use:
    - You need long-term continuous recording storage (use condensed-data)
    - You need a standalone CLI tool without IDE integration
  vs: ~
  related:
    - { label: "jfrtofp", url: "https://github.com/parttimenerd/jfrtofp" }
    - { label: "jfrtofp-server", url: "https://github.com/parttimenerd/jfrtofp-server" }
    - { label: "intellij-profiler-plugin", url: "https://github.com/parttimenerd/intellij-profiler-plugin" }
  links:
    - { label: "IntelliJ plugin ↗", url: "https://plugins.jetbrains.com/plugin/20937" }
    - { label: "Blog post ↗", url: "https://mostlynerdless.de/blog/2023/01/31/firefox-profiler-beyond-the-web/" }
  no_release: true
  install: ~
  usage:
    - label: Convert JFR
      lang: bash
      code: |
        # Using jfrtofp CLI
        java -jar jfrtofp.jar recording.jfr -o profile.json
        # Then open in Firefox Profiler
  note: ""

