  - You need to convert hs_err files to JSON for tooling or storage
  when_not_to_use:
  - You just need to read a crash report — open it in a text editor or use the VS Code extension
  related:
  - label: VS Code extension
    url: https://marketplace.visualstudio.com/items?itemName=bechberger.hserr-syntax
  install:
  - label: Maven
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>jhserr</artifactId>
        <version>VERSION</version>
      </dependency>
  - label: Gradle
    lang: groovy
    code: implementation 'me.bechberger:jhserr:VERSION'
  usage:
  - label: Parse + redact
    lang: java
    code: |
      HsErrReport report = HsErrParser.parse(Path.of("hs_err_pid12345.log"));
      System.out.println(report.header().errorType() + ": " + report.header().errorDetail());

      HsErrReport redacted = RedactionTransformer.withDefaults().transform(report);
      Files.writeString(Path.of("redacted.log"), redacted.toString());
  - label: CLI
    lang: bash
    code: |
      java -jar jhserr.jar redact hs_err_pid12345.log -o redacted.log
      java -jar jhserr.jar json to hs_err_pid12345.log > report.json
  how_to:
  - title: Redact a crash report before sharing
    body: |
      The default preset strips usernames, paths, hostnames, PIDs, IP addresses, and env vars.
      Use `--minimal` or `--aggressive` for lighter or heavier redaction:
      ```bash
      java -jar jhserr.jar redact hs_err_pid12345.log -o redacted.log
      java -jar jhserr.jar redact --aggressive hs_err_pid12345.log -o redacted.log
      java -jar jhserr.jar redact --scan hs_err_pid12345.log   # scan only, no output
      ```
      Add extra hints for paths or usernames not auto-detected:
      ```bash
      java -jar jhserr.jar redact --username jdoe --sensitive-path /home/jdoe/project \
          hs_err_pid12345.log -o redacted.log
      ```
  - title: Walk the parsed model with the visitor pattern
    body: |
      Override only the visit methods you need — all default to no-ops:
      ```java
      report.accept(new HsErrVisitor() {
          @Override
          public void visitJavaFrames(FrameList frames) {
              frames.frames().forEach(f -> System.out.println(f.method()));
          }
          @Override
          public void visitEnvironmentVariables(EnvironmentVariables vars) {
              vars.variables().forEach((k, v) -> System.out.println(k + "=" + v));
          }
      });
      ```
  - title: Convert to JSON for tooling
    body: |
      ```java
      String json = HsErrJson.toJson(report);
      HsErrReport restored = HsErrJson.fromJson(json); // round-trip
      ```
      Or via CLI:
      ```bash
      java -jar jhserr.jar json to hs_err.log > report.json
      java -jar jhserr.jar json from report.json > restored.log
      java -jar jhserr.jar json schema > schema.json
      ```
  note: Early prototype — no guarantees regarding functionality or security.
- id: jdklogs
  group: Crash / Log Diagnostics
  tag: ready
  github_pages: https://parttimenerd.github.io/jdklogs/
  tagline: Interactive browser tool for exploring OpenJDK's -Xlog subsystem. Enter a log config and see
    exactly which log statements match — with source context, GitHub permalinks, sample output from benchmark
    runs, and a volume estimate. Use it when you are tuning GC, JIT, or other -Xlog flags and want to
    understand what output you will get before deploying.
  tagline_short: Interactive browser tool to explore -Xlog configs — see which statements match before
    deploying.
  features:
  - Config search with autocomplete over all -Xlog tags and levels
  - Selector wizard — toggle tags on/off without knowing the syntax
  - Firing log sites grouped by file with surrounding source context and GitHub permalinks
  - Real sample output captured from benchmark runs (G1, ZGC, Parallel)
  - Volume estimate (≈ MB/hour) per tag to gauge logging overhead
  - Coverage across JDK versions from LTS to master
  no_release: true
  note: Data is regenerated monthly from the OpenJDK source and redeployed to GitHub Pages.
- id: test-order
  group: Testing
  tag: experimental
  maven_coordinates: me.bechberger:test-order-maven-plugin
  tagline: Maven and Gradle plugin that reorders your test suite so tests covering recently changed code
    run first. Uses bytecode instrumentation to track class-to-test coverage, then on the next run promotes
    affected tests to the front — zero config, no cloud, no annotations.
  tagline_short: Run the tests most likely to fail first — zero-config test prioritisation for Maven/Gradle.
  github_pages: https://parttimenerd.github.io/test-order/
  when_to_use:
  - You want faster feedback in CI by surfacing relevant failures early
  - Your test suite is large enough that waiting for the full run hurts productivity
  - You want zero-config test prioritisation with Maven or Gradle
  when_not_to_use:
  - You need cross-module coverage tracking (single-module only for now)
  - You are not using Maven or Gradle
  links:
  - label: Docs ↗
    url: https://parttimenerd.github.io/test-order/
  install:
  - label: Maven
    lang: xml
    code: |
      <plugin>
        <groupId>me.bechberger</groupId>
        <artifactId>test-order-maven-plugin</artifactId>
        <version>VERSION</version>
        <extensions>true</extensions>
        <executions>
          <execution>
            <goals><goal>prepare</goal></goals>
          </execution>
        </executions>
      </plugin>
  - label: Gradle
    lang: groovy
    code: |
      // build.gradle
      plugins {
          id 'me.bechberger.test-order' version 'VERSION'
      }
  usage:
  - label: Maven
    lang: bash
    code: |
      mvn test          # first run: learns coverage
      mvn test          # second run: affected tests go first
  - label: Gradle
    lang: bash
    code: |
      ./gradlew test    # first run: learns coverage
      ./gradlew test    # second run: affected tests go first
  how_to:
  - title: 'Enable the short mvn test-order: prefix'
    body: |
      Maven only resolves goal prefixes for trusted groupIds. Add `me.bechberger` to
      `~/.m2/settings.xml` once so the short form works from the CLI:
      ```xml
      <settings>
        <pluginGroups>
          <pluginGroup>me.bechberger</pluginGroup>
        </pluginGroups>
      </settings>
      ```
      Without this, use the fully-qualified form:
      ```bash
      mvn me.bechberger:test-order-maven-plugin:show
      ```
  - title: Inspect the test ranking and run affected tests only
    body: |
      **Maven:**
      ```bash
      mvn test-order:show       # ranked list of all tests
      mvn test-order:affected test  # run only tests affected by recent changes
      mvn test-order:dashboard  # full HTML report
      ```
      **Gradle:**
      ```bash
      ./gradlew testOrderShow
      ./gradlew testOrderAffected
      ./gradlew testOrderDashboard
      ```
  - title: Detect flaky and order-dependent tests
    body: |
      ```bash
      mvn test-order:detect-dependencies   # Maven
      ./gradlew testOrderDetectDependencies  # Gradle
      ```
      Runs the suite in multiple orders to surface tests that only pass in a specific sequence.
  - title: Diagnose why reordering isn't working
    body: |
      ```bash
      mvn test-order:diagnose         # Maven
      ./gradlew testOrderDiagnose     # Gradle
      ```
      Checks prerequisites (Java 17+, Maven 3.6+/Gradle 7.6+, Git), coverage data presence,
      and plugin configuration. Run this first if tests are not being reordered.
- id: execjar
  group: JAR Packaging
  tag: experimental
  maven_coordinates: me.bechberger:execjar
  tagline: Maven plugin and CLI that turns a fat JAR into a single self-executing file on Linux and macOS.
    Prepends a small POSIX sh launcher that finds Java automatically, checks min/max version requirements,
    and execs the JAR — no java -jar needed.
  tagline_short: Turn a fat JAR into a self-executing file — no java -jar needed on Linux/macOS.
  when_to_use:
  - You want to ship a CLI tool as a single executable without requiring users to run java -jar
  - You need automatic Java discovery and min/max version checking at startup
  when_not_to_use:
  - You are on Windows (Linux/macOS only)
  - You are packaging a library JAR (requires a fat/uber JAR with all dependencies)
  install:
  - label: Maven plugin
    lang: xml
    code: |
      <plugin>
        <groupId>me.bechberger</groupId>
        <artifactId>execjar</artifactId>
        <version>VERSION</version>
        <executions>
          <execution>
            <goals><goal>execjar</goal></goals>
          </execution>
        </executions>
      </plugin>
  - label: CLI via JBang
    lang: bash
    code: jbang execjar@parttimenerd/execjar
  usage:
  - label: Maven build + run
    lang: bash
    code: |
      mvn package
      ./target/your-app   # no java -jar needed
  - label: CLI
    lang: bash
    code: |
      execjar input.jar -o myapp
      ./myapp
  how_to:
  - title: Set up the two-step Maven build
    body: |
      execjar must run after a fat JAR has been assembled. Add it after your assembly or shade plugin:
      ```xml
      <!-- Step 1: assemble fat JAR -->
      <plugin>
        <artifactId>maven-assembly-plugin</artifactId>
        <version>3.6.0</version>
        <configuration>
          <descriptorRefs><descriptorRef>jar-with-dependencies</descriptorRef></descriptorRefs>
          <archive><manifest><mainClass>com.example.App</mainClass></manifest></archive>
        </configuration>
        <executions>
          <execution>
            <id>make-assembly</id>
            <phase>package</phase>
            <goals><goal>single</goal></goals>
          </execution>
        </executions>
      </plugin>

      <!-- Step 2: wrap it -->
      <plugin>
        <groupId>me.bechberger</groupId>
        <artifactId>execjar</artifactId>
        <version>VERSION</version>
        <executions>
          <execution>
            <goals><goal>execjar</goal></goals>
          </execution>
        </executions>
      </plugin>
      ```
      After `mvn package`, run the output directly — the launcher searches `$JAVA_HOME`, then `PATH`,
      then `/etc/alternatives/java`, then common install locations under `/Library/Java` and `/usr/lib/jvm`:
      ```bash
      ./target/your-app
      ```
  - title: Enforce a minimum (or maximum) Java version
    body: |
      Add `<minJavaVersion>` and/or `<maxJavaVersion>` to the plugin configuration:
      ```xml
      <configuration>
        <minJavaVersion>17</minJavaVersion>
        <maxJavaVersion>21</maxJavaVersion>
      </configuration>
      ```
      `minJavaVersion` defaults to `maven.compiler.release` or `maven.compiler.target` if set, so you
      often don't need to configure it explicitly. The launcher prints a clear error and exits if the
      requirement isn't met.
  - title: Embed JVM options and system properties
    body: |
      JVM flags and system properties can be baked into the launcher so users don't need to set them:
      ```xml
      <configuration>
        <jvmOpts>-Xmx512m -XX:+UseG1GC</jvmOpts>
        <javaProperties>
          <app.name>My Application</app.name>
          <app.config>/opt/myapp/config</app.config>
        </javaProperties>
      </configuration>
      ```
      Environment variables, prepended/appended default arguments, and strict-mode (exact version match)
      are also supported — see the README for the full configuration reference.
  - title: Debug Java discovery at runtime
    body: |
      Set `EXECJAR_DEBUG=1` before running to print the selected Java executable, detected version,
      resolved JVM options, and the final exec command:
      ```bash
      EXECJAR_DEBUG=1 ./target/your-app
      ```
      This is useful when the wrong Java is picked up or version checks fail unexpectedly.
- id: meta-agent
  group: Agent Development
  tag: experimental
  maven_coordinates: me.bechberger:meta-agent
  tagline: Java agent that instruments other Java agents — wraps every ClassFileTransformer it finds and
    records bytecode diffs viewable via a built-in web UI. Shows exactly what Mockito, Dynatrace, async-profiler,
    or any other agent does to your classes at runtime.
  tagline_short: Instrument your Java agents — record and diff the bytecode transformations they apply.
  when_to_use:
  - You want to see exactly what bytecode transformations a Java agent (Mockito, Dynatrace, async-profiler)
    applies
  - You are debugging unexpected behaviour caused by another agent's class instrumentation
  - You want to intercept or block specific ClassFileTransformer registrations at runtime
  when_not_to_use:
  - You only want to view class bytecode without running another agent — use a decompiler instead
  install:
  - label: Build from source
    lang: bash
    code: |
      git clone https://github.com/parttimenerd/meta-agent
      cd meta-agent
      mvn package -DskipTests
      # JAR: target/meta-agent.jar
  - label: Maven plugin (for tests)
    lang: xml
    code: |
      <plugin>
        <groupId>me.bechberger</groupId>
        <artifactId>meta-agent-maven-plugin</artifactId>
        <version>VERSION</version>
        <executions>
          <execution>
            <phase>validate</phase>
            <goals><goal>meta-agent</goal></goals>
          </execution>
        </executions>
        <configuration>
          <server>true</server>
        </configuration>
      </plugin>
  usage:
  - label: Run with agent
    lang: bash
    code: |
      java -javaagent:target/meta-agent.jar=server -jar your-program.jar
      # open http://localhost:7071 to browse transformations
  how_to:
  - title: View what an agent does to your classes
    body: |
      Attach meta-agent alongside the agent you want to inspect. Open the built-in web UI to browse
      decompiled bytecode diffs grouped by transformer or by class:
      ```bash
      java -javaagent:target/meta-agent.jar=server -jar your-program.jar
      # custom port:
      java -javaagent:target/meta-agent.jar=server,port=8080 -jar your-program.jar
      ```
      Key endpoints at `http://localhost:7071`:
      - `/instrumentators` — list all ClassFileTransformers that were registered
      - `/full-diff/instrumentator?pattern=.*` — decompiled bytecode diff per transformer
      - `/classes` — list all classes that were transformed
      - `/full-diff/class?pattern=.*` — full diff across all classes and transformers
      - `/all/decompile?pattern=<pattern>` — decompile matching classes
  - title: Intercept or block transformer registrations with a callback
    body: |
      Implement `InstrumentationCallback` and pass it via the `cb` argument to observe or block
      transformers. Note: `CallbackAction.IGNORE` suppresses the transformer (not `DENY`):
      ```java
      public class MyHandler implements InstrumentationCallback {
          @Override
          public CallbackAction onAddTransformer(ClassFileTransformer transformer) {
              System.err.println("New transformer: " + transformer.getClass().getName());
              return CallbackAction.ALLOW; // or IGNORE to suppress it
          }

          @Override
          public void onExistingTransformer(ClassFileTransformer transformer) {
              System.err.println("Existing transformer: " + transformer.getClass().getName());
          }

          @Override
          public CallbackAction onInstrumentation(ClassFileTransformer transformer,
                  ClassArtifact before, ClassArtifact after) {
              System.out.println("Instrumenting: " + before.klass().getName());
              return CallbackAction.ALLOW;
          }
      }
      ```
      Pass the fully qualified class name via `cb`:
      ```bash
      java -javaagent:target/meta-agent.jar=server,cb=com.example.MyHandler -jar your-program.jar
      ```
  - title: Capture native agents too
    body: |
      Build the native component first, then load both agents:
      ```bash
      cd native && make
      # macOS:
      java -agentpath:native/native_agent.dylib \
           -javaagent:target/meta-agent.jar=server \
           -jar your-program.jar
      # Linux:
      java -agentpath:native/native_agent.so \
           -javaagent:target/meta-agent.jar=server \
           -jar your-program.jar
      ```
  - title: Add to Maven test runs
    body: |
      Use the Maven plugin to attach meta-agent automatically during `mvn test`:
      ```xml
      <plugin>
        <groupId>me.bechberger</groupId>
        <artifactId>meta-agent-maven-plugin</artifactId>
        <version>VERSION</version>
        <executions>
          <execution>
            <phase>validate</phase>
            <goals><goal>meta-agent</goal></goals>
          </execution>
        </executions>
        <configuration>
          <server>true</server>
          <callbackClasses>
            <callbackClass>com.example.MyHandler</callbackClass>
          </callbackClasses>
        </configuration>
      </plugin>
      ```
      Add the runtime dependency so your callback class can reference the API:
      ```xml
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>meta-agent</artifactId>
        <version>VERSION</version>
        <scope>test</scope>
      </dependency>
      ```
- id: jthreaddump
  group: Libraries
  tag: ready
  maven_coordinates: me.bechberger:jthreaddump
  tagline: Java library for parsing thread dump output from jstack and jcmd into a typed model. Handles
    all major thread dump formats across JDK versions, including virtual threads, giving you structured
    access to thread states, stack frames, lock information, CPU times, and deadlock cycles.
  tagline_short: Parse jstack/jcmd thread dumps into a structured Java model — all JDK formats supported.
  when_to_use:
  - You need to programmatically parse and analyse Java thread dumps
  - You are building tooling that processes jstack or jcmd output
  - You want to diff thread dumps or detect recurring blocking patterns
  - You need virtual thread support in thread dump parsing
  when_not_to_use:
  - You need live thread inspection (use jstall instead)
  - You need profiling data (use the JFR profiling tools instead)
  install:
  - label: Maven
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>jthreaddump</artifactId>
        <version>VERSION</version>
      </dependency>
  - label: Maven (minimal, no Jackson)
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>jthreaddump-minimal</artifactId>
        <version>VERSION</version>
      </dependency>
  - label: Gradle
    lang: groovy
    code: implementation 'me.bechberger:jthreaddump:VERSION'
  usage:
  - label: Parse and inspect
    lang: java
    code: |
      ThreadDump dump = ThreadDumpParser.parse(dumpText);
      for (var thread : dump.threads()) {
          System.out.println(thread.name() + " - " + thread.state());
      }
      if (dump.deadlockInfos() != null && !dump.deadlockInfos().isEmpty()) {
          System.out.println("Deadlocks detected!");
      }
  how_to:
  - title: Capture a live thread dump and parse it
    body: |
      ```java
      String raw = JStackUtil.captureThreadDump(pid);        // uses jstack
      String raw = JStackUtil.captureThreadDump(pid, true);  // uses jcmd (Thread.print -l)
      ThreadDump dump = ThreadDumpParser.parse(raw);
      ```
      jcmd output includes more detail: CPU time, elapsed time, and JNI reference counts.
  - title: Find BLOCKED threads and the locks they are waiting for
    body: |
      ```java
      ThreadDump dump = ThreadDumpParser.parse(dumpText);
      dump.threads().stream()
          .filter(t -> t.state() == Thread.State.BLOCKED)
          .forEach(t -> System.out.println(t.name() + " is blocked"));
      ```
      Lock information (monitors held/waiting, object addresses) is available on each thread object.
  - title: Find threads consuming the most CPU time
    body: |
      CPU time is populated when using jcmd output (`JStackUtil.captureThreadDump(pid, true)`).
      ```java
      dump.threads().stream()
          .filter(t -> t.cpuTimeSec() != null)
          .sorted((a, b) -> Double.compare(b.cpuTimeSec(), a.cpuTimeSec()))
          .limit(10)
          .forEach(t -> System.out.printf("%s: %.2f sec CPU%n", t.name(), t.cpuTimeSec()));
      ```
  - title: Diff two thread dumps
    body: |
      ```java
      ThreadDump before = ThreadDumpParser.parse(Files.readString(Path.of("before.txt")));
      ThreadDump after  = ThreadDumpParser.parse(Files.readString(Path.of("after.txt")));
      System.out.println("Thread delta: " + (after.threads().size() - before.threads().size()));
      ```
      Use this pattern to compare dumps taken during a suspected leak or thread explosion.
  - title: Use the CLI to pretty-print a dump
    body: |
      The library ships a minimal CLI for quick inspection:
      ```bash
      jthreaddump dump.txt           # parse and display summary
      jstack <pid> | jthreaddump -   # pipe from jstack
      jthreaddump dump.txt -v        # verbose output
      ```
      Build it with `mvn clean package`, then run `java -jar target/jthreaddump.jar`.
- id: writing-a-profiler
  group: Learning Resources
  tag: demo
  no_release: true
  tagline: Companion code for the "Writing a Profiler from Scratch" blog series. A minimal C++/JVMTI sampling
    profiler that uses AsyncGetCallTrace via signal-based interrupts — showing the core mechanics of how
    production profilers like async-profiler work under the hood.
  tagline_short: Companion code for "Writing a Profiler from Scratch" — minimal JVMTI/AsyncGetCallTrace
    profiler.
  links:
  - label: Blog series ↗
    url: https://mostlynerdless.de/blog/2022/12/20/writing-a-profiler-from-scratch-introduction/
  when_to_use:
  - You are reading the blog series and want to run the example code
  - You want to study the core mechanics of a signal-based JVMTI sampling profiler
  when_not_to_use:
  - You need a production profiler — use async-profiler or JFR instead
  - You want a pure-Java profiler — see tiny-profiler instead
  install:
  - label: Build from source
    lang: bash
    code: |
      git clone https://github.com/parttimenerd/writing-a-profiler
      cd writing-a-profiler
      javac samples/BasicSample.java
      # macOS:
      g++ cpp/libSmallProfiler.cpp -I$JAVA_HOME/include/darwin -I$JAVA_HOME/include \
          -o cpp/libSmallProfiler.dylib -std=c++17 -shared -pthread
      # Linux:
      g++ cpp/libSmallProfiler.cpp -I$JAVA_HOME/include/linux -I$JAVA_HOME/include \
          -o cpp/libSmallProfiler.so -std=c++17 -shared -pthread
  usage:
  - label: Profile a sample app
    lang: bash
    code: |
      # macOS:
      java -agentpath:cpp/libSmallProfiler.dylib=interval=0.001s -cp samples BasicSample
      # Linux:
      java -agentpath:cpp/libSmallProfiler.so=interval=0.001s -cp samples BasicSample
  note: Don't set the interval too low or you will crash the JVM. Educational code only — not for production
    use.
