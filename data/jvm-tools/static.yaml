- id: jthreaddump
  tag: ready
  group: "Libraries"
  maven_coordinates: "me.bechberger:jthreaddump"
  tagline: "Java library for parsing thread dump output from jstack and jcmd into a typed model. Handles all major thread dump formats across JDK versions, including virtual threads, giving you structured access to thread states, stack frames, and lock information. Use it when you are building tooling that processes or compares thread dumps programmatically."
  tagline_short: "Parse jstack/jcmd thread dumps into a structured Java model — all JDK formats supported."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You need to programmatically parse and analyse Java thread dumps
    - You are building tooling that processes jstack or jcmd output
    - You want to diff thread dumps or detect recurring blocking patterns
  when_not_to_use:
    - You need live thread inspection (use jstall instead)
    - You need profiling data (use the JFR profiling tools instead)
  vs: ~
  related: []
  links: []
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <dependency>
          <groupId>me.bechberger</groupId>
          <artifactId>jthreaddump</artifactId>
          <version>VERSION</version>
        </dependency>
    - label: Gradle
      lang: groovy
      code: "implementation 'me.bechberger:jthreaddump:VERSION'"
  usage:
    - label: Parse dump
      lang: java
      code: |
        ThreadDump dump = ThreadDumpParser.parse(Files.readString(path));
        System.out.println("Threads: " + dump.threads().size());
        for (var thread : dump.threads()) {
            System.out.println(thread.name() + " - " + thread.state());
        }
        if (dump.deadlockInfos() != null && !dump.deadlockInfos().isEmpty()) {
            System.out.println("Deadlocks detected!");
        }
    - label: Capture + parse
      lang: java
      code: |
        String raw = JStackUtil.captureThreadDump(pid);
        ThreadDump dump = ThreadDumpParser.parse(raw);
    - label: CLI
      lang: bash
      code: |
        jthreaddump dump.txt      # parse and display summary
        jstack 12345 | jthreaddump -   # read from stdin
  note: ""

