  related: []
  links: []
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <dependency>
          <groupId>me.bechberger</groupId>
          <artifactId>meta-agent</artifactId>
          <version>VERSION</version>
        </dependency>
  usage:
