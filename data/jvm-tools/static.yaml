# ─────────────────────────────────────────────────────────────────────────────
# ENTRY SCHEMA  (omit any optional field you don't need)
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED
#   id:               string  — slug, matches GitHub repo name (parttimenerd/<id>)
#   tag:              ready | experimental | poc | demo
#   tagline:          string  — 1–2 sentence description shown in detail view
#   tagline_short:    string  — ≤ 10 words shown on cards and in the nav tooltip
#
# OPTIONAL — source control
#   github_url:       string  — full URL; defaults to https://github.com/parttimenerd/<id>
#   github_pages:     string  — docs/web-app URL; shows "Docs" or "Web app" link in header
#
# OPTIONAL — release resolution (script tries these in order, falls back to GitHub)
#   maven_coordinates: "groupId:artifactId"  — used by fetch_releases.py
#   cargo_crate:       "crate-name"          — used by fetch_releases.py
#   static_version:    string  — hard-coded version when no release source exists
#   no_release:        true    — skip this entry in fetch_releases.py entirely
#
# OPTIONAL — card/detail content
#   group:            string  — section heading on the collection page
#   screenshot:       string  — URL; shown with lightbox in detail view
#   when_to_use:      list    — bullet points (shown green ✓)
#   when_not_to_use:  list    — bullet points (shown red ✗)
#   features:         list    — bullet points for demo/poc entries without when_to_use
#   vs:               object  — comparison table:
#                       name: "Other Lib"
#                       url:  "https://..."
#                       bottom_line: "One-liner picking guidance"
#                       comparison:
#                         - { feature: "JAR size", femto: "~50 KB", other: "~870 KB" }
#   related:          list    — { label: "name", url: "https://..." }
#   links:            list    — { label: "Blog post ↗", url: "https://..." }
#   install:          list    — code tabs:
#                         - label: Maven
#                           lang: xml
#                           code: |
#                             <dependency>...</dependency>
#                       VERSION is substituted with the resolved release version
#   usage:            list    — same structure as install; VERSION not substituted
#   note:             string  — shown as amber callout at the bottom of the detail section
#
# OPTIONAL — external site filtering
#   no_sap:           true    — exclude from SapMachineIOPage JVM Tools listing (default: false)
# ─────────────────────────────────────────────────────────────────────────────
#
# COPY-PASTE TEMPLATE FOR A NEW ENTRY:
#
# - id: my-tool
#   tag: experimental
#   tagline: "One or two sentences. Use it when..."
#   tagline_short: "≤10 words"
#   when_to_use:
#     - You need X
#   when_not_to_use:
#     - You need Y
#   install:
#     - label: Maven
#       lang: xml
#       code: |
#         <dependency>
#           <groupId>me.bechberger</groupId>
#           <artifactId>my-tool</artifactId>
#           <version>VERSION</version>
#         </dependency>
#   usage:
#     - label: Example
#       lang: java
#       code: |
#         // example code here
# ─────────────────────────────────────────────────────────────────────────────

- id: jstall
  tag: ready
  group: Live JVM Inspection
  tagline: One-shot CLI inspector for running JVMs. Detects deadlocks, identifies hot threads, captures
    short-burst flamegraphs via async-profiler, and provides a live TUI — all without a persistent agent
    or IDE attachment. Use it when you need instant insight into a misbehaving JVM in production, staging,
    or CF without setting up a full profiler.
  tagline_short: Instant JVM insight — deadlocks, hot threads, flamegraphs — no agent needed.
  when_to_use:
  - You need instant insight into a running JVM without attaching a full profiler
  - You need deadlock detection, hot thread analysis, or a quick flamegraph
  - You are working in a Cloud Foundry Java environment
  when_not_to_use:
  - You need continuous long-term profiling (use condensed-data + JFR instead)
  - You need allocation or lock profiling in depth
  related:
  - label: IntelliJ plugin
    url: https://github.com/parttimenerd/jstall-intellij-plugin
  - label: VS Code extension
    url: https://github.com/parttimenerd/jstall-vscode-extension
  links:
  - label: JetBrains marketplace ↗
    url: https://plugins.jetbrains.com/plugin/30667-jstall
  - label: VS Code marketplace ↗
    url: https://marketplace.visualstudio.com/items?itemName=bechberger.jstall
  install:
  - label: Download JAR
    lang: bash
    code: |
      curl -L https://github.com/parttimenerd/jstall/releases/latest/download/jstall.jar \
        -o jstall.jar
      java -jar jstall.jar --help
  usage:
  - label: Inspect JVM
    lang: bash
    code: |
      java -jar jstall.jar status <pid>
      java -jar jstall.jar flamegraph <pid>
- id: cf-cli-java-plugin
  tag: ready
  group: Live JVM Inspection
  github_url: https://github.com/SAP/cf-cli-java-plugin
  tagline: Cloud Foundry CLI plugin to troubleshoot Java apps running on CF without SSH. Trigger heap
    dumps, thread dumps, and JFR recordings from the cf command line, with the results streamed back to
    your machine. Use it when you need jstall-style JVM inspection but container SSH access is not available.
  tagline_short: Trigger heap dumps, thread dumps, and JFR recordings from the CF CLI — no SSH needed.
  when_to_use:
  - You run Java apps on Cloud Foundry and need heap dumps, thread dumps, or JFR recordings
  - You want jstall-style JVM inspection without SSH access to the container
  when_not_to_use:
  - You are not using Cloud Foundry
  related:
  - label: jstall
    url: https://github.com/parttimenerd/jstall
  links:
  - label: CF Plugin Registry ↗
    url: https://plugins.cloudfoundry.org/
  install:
  - label: CF CLI
    lang: bash
    code: |
      cf install-plugin -r CF-Community "java"
  usage:
  - label: Inspect app
    lang: bash
    code: |
      cf java heap-dump my-app
      cf java thread-dump my-app
- id: jfr-profiling
  tag: ready
  group: JFR / Profiling
  tagline: Ecosystem of tools to convert, view, and share JFR recordings as flame graphs in the Firefox
    Profiler UI. Converts JFR files to Firefox Profiler JSON, bundles a patched viewer as a server, and
    provides an IntelliJ plugin that profiles and shows results directly in the IDE. Use it when you want
    JFR profiling integrated into your browser or IDE workflow.
  tagline_short: View and share JFR recordings as Firefox Profiler flame graphs — browser or IntelliJ.
  screenshot: https://mostlynerdless.de/wp-content/uploads/2023/01/Screenshot-2023-01-27-at-12.31.55-2048x1230.png
  static_version: 2026-07
  when_to_use:
  - You want to view JFR recordings as flame graphs in the Firefox Profiler UI
  - You want JFR profiling integrated directly into IntelliJ IDEA
  - You need to share or embed profiling results as a web link
  when_not_to_use:
  - You need long-term continuous recording storage (use condensed-data)
  - You need a standalone CLI tool without IDE integration
  related:
  - label: jfrtofp
    url: https://github.com/parttimenerd/jfrtofp
  - label: jfrtofp-server
    url: https://github.com/parttimenerd/jfrtofp-server
  - label: intellij-profiler-plugin
    url: https://github.com/parttimenerd/intellij-profiler-plugin
  links:
  - label: IntelliJ plugin ↗
    url: https://plugins.jetbrains.com/plugin/20937
  - label: Blog post ↗
    url: https://mostlynerdless.de/blog/2023/01/31/firefox-profiler-beyond-the-web/
  no_release: true
  usage:
  - label: Convert JFR
    lang: bash
    code: |
      java -jar jfrtofp.jar recording.jfr -o profile.json
      # Then open in Firefox Profiler or via jfrtofp-server
- id: firefox-profiler
  tag: experimental
  group: JFR / Profiling
  tagline: Fork of the Firefox Profiler web app with patches that add native JFR file loading and JFR-specific
    UI improvements. Open a JFR recording directly in the browser — no server, no conversion step. Used
    as the embedded viewer in jfrtofp-server.
  tagline_short: Fork of Firefox Profiler that opens JFR recordings natively in the browser.
  when_to_use:
  - You want to open a JFR recording directly in the Firefox Profiler UI without a conversion step
  - You are using jfrtofp-server and want the embedded profiler viewer
  - You need a locally-hosted profiler viewer with JFR-specific patches
  when_not_to_use:
  - You want the upstream Firefox Profiler without JFR customisations
  - You are not working with JFR recordings
  related:
  - label: jfrtofp
    url: https://github.com/parttimenerd/jfrtofp
  - label: jfrtofp-server
    url: https://github.com/parttimenerd/jfrtofp-server
  links:
  - label: Upstream ↗
    url: https://profiler.firefox.com
  no_release: true
  note: Used by jfrtofp-server as the embedded viewer.
- id: jfr-query
  tag: experimental
  group: JFR / Profiling
  tagline: Turns JFR recordings into a DuckDB database and exposes them through an in-browser notebook
    UI. Write SQL, get charts, explore event distributions, and use built-in views for common analyses
    — no install needed. Use it for ad-hoc investigation when you want to correlate events across types
    (GC, allocations, CPU) in a single query.
  tagline_short: SQL notebook for JFR recordings — drag in a file, write SQL, get charts.
  github_pages: https://parttimenerd.github.io/jfr-query/
  when_to_use:
  - You want to run ad-hoc SQL queries over JFR event data
  - You need charts and notebook-style exploration of recordings
  - You want to correlate events across types (GC, allocations, CPU) in one query
  when_not_to_use:
  - You need a stable, production-ready tool (schema may change)
  - You need IDE integration (use the profiler plugin instead)
  links:
  - label: Web app ↗
    url: https://parttimenerd.github.io/jfr-query/
  usage:
  - label: Open web app
    lang: text
    code: |
      Open https://parttimenerd.github.io/jfr-query/
      Drag and drop your .jfr file to get started.
- id: condensed-data
  tag: experimental
  group: JFR / Profiling
  maven_coordinates: me.bechberger.condensed:condensed-data
  tagline: CLI tool and Java agent for long-term, low-overhead JFR event storage. Records events from
    a running JVM via live-attach and compresses them into the self-describing .cjfr format — significantly
    smaller than raw JFR. Includes a reader library for querying the stored data. Use it when you need
    weeks of JFR data on disk without filling the drive.
  tagline_short: CLI tool and agent for compact long-term JFR event storage — significantly smaller than
    raw .jfr.
  static_version: latest
  github_pages: https://parttimenerd.github.io/condensed-data/
  when_to_use:
  - You need long-term storage of JFR recordings with minimal disk usage
  - You want live-attach to a running JVM for continuous event capture
  - You are storing GC or other continuous JFR data over days or weeks
  when_not_to_use:
  - You need immediate full JFR replay compatibility without a reader library
  - You need a stable format (early development, format may change)
  links:
  - label: Docs ↗
    url: https://parttimenerd.github.io/condensed-data/
  no_release: true
  usage:
  - label: Record JFR events
    lang: bash
    code: |
      # See https://parttimenerd.github.io/condensed-data/ for setup
      condensed-data attach <pid> --output recording.cjfr
  note: No stable release yet — rolling snapshots only. Check the docs for the current version.
- id: jfrevents
  tag: ready
  group: JFR / Profiling
  github_url: https://github.com/SAP/jfrevents
  tagline: Reference site listing every JFR event across JDK versions, with field names, types, descriptions,
    and benchmark-derived examples showing which events fire at what rate. Use it when you are writing
    JFR tooling and need to know exactly which fields an event has or which events are worth subscribing
    to.
  tagline_short: Reference site for every JFR event type across JDK versions.
  github_pages: https://sap.github.io/jfrevents/
  when_to_use:
  - You need to know what fields a JFR event has across JDK versions
  - You are writing JFR tooling and need event documentation
  - You want to understand which events are worth subscribing to for a given use case
  when_not_to_use:
  - You need a programmatic API (this is a reference site)
  links:
  - label: Website ↗
    url: https://sap.github.io/jfrevents/
  no_release: true
  note: Canonical site is at sap.github.io/jfrevents/
- id: tiny-profiler
  tag: demo
  group: JFR / Profiling
  tagline: Educational sampling profiler for Java 17+, written entirely in Java using Thread.getAllStackTraces().
    Outputs method tables and interactive HTML flamegraphs via d3-flame-graph. Use it when you want to
    understand how profilers work from the inside — simple enough to read in an afternoon.
  tagline_short: Educational Java profiler — pure Java, flamegraph output, easy to read and learn from.
  features:
  - Pure Java — no native code, no JVM agents, no setup beyond a JAR
  - Outputs method tables and interactive HTML flamegraphs (d3-flame-graph)
  - Safepoint-biased sampling via Thread.getAllStackTraces() — intentionally simple
  - Small enough to read the entire source in a single sitting
  related:
  - label: writing-a-profiler
    url: https://github.com/parttimenerd/writing-a-profiler
  links:
  - label: Blog series ↗
    url: https://mostlynerdless.de/blog/category/profiling/
  no_release: true
  install:
  - label: Build
    lang: bash
    code: |
      git clone https://github.com/parttimenerd/tiny-profiler
      cd tiny-profiler && mvn package
  usage:
  - label: Profile
    lang: bash
    code: |
      java -javaagent:target/tiny-profiler.jar=flamegraph=flames.html \
        -jar yourapp.jar
      # Opens flames.html with an interactive flamegraph
  note: Safepoint-biased — good for learning, not for production profiling decisions.
- id: hprof-analyzer
  tag: experimental
  group: Heap Dump Analysis
  tagline: Fast heap dump analyser written in Rust with a Java CLI frontend. Reproduces the key Eclipse
    MAT views — System Overview, Leak Suspects, Top Consumers, Threads — with a fraction of the memory
    overhead. Handles heap dumps larger than 10 GiB that MAT cannot open, and also available as an in-browser
    WASM tool.
  tagline_short: Fast Rust-based heap dump analyser — handles >10 GiB dumps that MAT cannot open.
  cargo_crate: hprof-analyzer
  github_pages: https://parttimenerd.github.io/hprof-analyzer/
  when_to_use:
  - You need to analyse a heap dump without Eclipse MAT's memory overhead
  - You have a very large heap dump (>10 GiB) that MAT cannot handle
  - You want a quick in-browser analyser for smaller dumps (up to ~3 GiB)
  when_not_to_use:
  - You need full MAT feature coverage (OQL queries, custom reports)
  - You need Windows support (native binary currently linux/mac only)
  links:
  - label: Web analyser ↗
    url: https://parttimenerd.github.io/hprof-analyzer/
  install:
  - label: Download
    lang: bash
    code: |
      curl -L https://github.com/parttimenerd/hprof-analyzer/releases/latest/download/hprof-analyzer \
        -o hprof-analyzer && chmod +x hprof-analyzer
  usage:
  - label: Analyse dump
    lang: bash
    code: |
      ./hprof-analyzer heap.hprof
      ./hprof-analyzer heap.hprof --leak-suspects
- id: hprof-redact
  tag: poc
  group: Heap Dump Analysis
  maven_coordinates: me.bechberger:hprof-redact
  tagline: Stream-based tool that redacts primitive values and strings from HPROF heap dumps without loading
    the full file into memory, preserving the binary structure so the result remains a valid HPROF file.
    Use it when you need to share a heap dump that contains sensitive string data.
  tagline_short: Stream-redact strings from HPROF heap dumps without loading them fully into memory.
  when_to_use:
  - You need to share a heap dump but it contains sensitive string data
  - You need to redact HPROF files while preserving their structure for further analysis
  when_not_to_use:
  - You need guaranteed complete privacy (proof-of-concept, not audited)
  - You need to redact JFR recordings (not supported)
  install:
  - label: Maven
    lang: xml
    code: |
      <dependency>
        <groupId>me.bechberger</groupId>
        <artifactId>hprof-redact</artifactId>
        <version>VERSION</version>
      </dependency>
  usage:
  - label: CLI
    lang: bash
    code: |
      java -jar hprof-redact.jar input.hprof output-redacted.hprof
  note: Early proof-of-concept.
