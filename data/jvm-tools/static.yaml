- id: condensed-data
  tag: experimental
  group: "JFR / Profiling"
  tagline: "Compress and store JFR events long-term in the self-describing .cjfr format."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You need long-term storage of JFR recordings with minimal disk usage
    - You want live-attach to a running JVM for continuous event capture
    - You are storing GC or other continuous JFR data over days/weeks
  when_not_to_use:
    - You need immediate full JFR replay compatibility without a reader library
    - You need a stable format (early development, format may change)
  vs: ~
  related: []
  links:
    - { label: "Docs ↗", url: "https://parttimenerd.github.io/condensed-data/" }
  no_release: false
  install:
    - label: Maven
      lang: xml
      code: |
        <dependency>
          <groupId>me.bechberger.condensed</groupId>
          <artifactId>condensed-data</artifactId>
          <version>VERSION</version>
        </dependency>
  usage:
    - label: Write .cjfr
      lang: java
      code: |
        // See https://parttimenerd.github.io/condensed-data/ for full API
        CJFRWriter writer = new CJFRWriter(outputStream);
        writer.write(jfrEvent);
  note: ""

