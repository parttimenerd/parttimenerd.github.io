- id: jstall
  tag: ready
  group: "Live JVM Inspection"
  tagline: "One-shot CLI inspector for running JVMs. Detects deadlocks, identifies hot threads, captures short-burst flamegraphs via async-profiler, and provides a live TUI — all without a persistent agent or IDE attachment. Use it when you need instant insight into a misbehaving JVM in production, staging, or CF without setting up a full profiler."
  tagline_short: "Instant JVM insight — deadlocks, hot threads, flamegraphs — no agent needed."
  screenshot: ""
  static_version: ""
  when_to_use:
    - You need instant insight into a running JVM without attaching a full profiler
    - You need deadlock detection, hot thread analysis, or a quick flamegraph
    - You are working in a Cloud Foundry Java environment
  when_not_to_use:
    - You need continuous long-term profiling (use condensed-data + JFR instead)
    - You need allocation or lock profiling in depth
  vs: ~
  related:
    - { label: "IntelliJ plugin", url: "https://github.com/parttimenerd/jstall-intellij-plugin" }
    - { label: "VS Code extension", url: "https://github.com/parttimenerd/jstall-vscode-extension" }
  links:
    - { label: "JetBrains marketplace ↗", url: "https://plugins.jetbrains.com/plugin/30667-jstall" }
    - { label: "VS Code marketplace ↗", url: "https://marketplace.visualstudio.com/items?itemName=bechberger.jstall" }
  no_release: false
  install:
    - label: Download JAR
      lang: bash
      code: |
        curl -L https://github.com/parttimenerd/jstall/releases/latest/download/jstall.jar \
          -o jstall.jar
        java -jar jstall.jar --help
  usage:
    - label: Inspect JVM
      lang: bash
      code: |
        java -jar jstall.jar status <pid>
        java -jar jstall.jar flamegraph <pid>
  note: ""

