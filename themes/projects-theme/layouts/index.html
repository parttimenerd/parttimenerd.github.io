{{ define "main" }}
<div class="max-w-3xl mx-auto px-4 py-16">
  <h1 class="font-['Vollkorn'] text-4xl font-bold mb-4">parttimenerd</h1>
  <p class="text-gray-600 text-lg mb-10">{{ .Content }}</p>
  <div class="flex flex-col gap-3">
    {{ range site.Params.nav }}
    <a href="{{ .url }}"
       class="text-blue-600 hover:text-blue-800 font-medium text-lg">
      {{ .label }} →
    </a>
    {{ end }}
    <a href="{{ site.Params.blog_url }}" target="_blank" rel="noopener"
       class="text-blue-600 hover:text-blue-800 font-medium text-lg">
      blog ↗
    </a>
  </div>
</div>
{{ end }}
